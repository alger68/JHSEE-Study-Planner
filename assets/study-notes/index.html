<script>
/* Shared pure functions. No DOM access; also used by Node tests and the builder. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.StudyCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const APP = 'jh-study-notes';
  const ID = /^[a-z0-9][a-z0-9-]*$/;
  const object = x => x !== null && typeof x === 'object' && !Array.isArray(x);
  const text = x => typeof x === 'string' && x.trim().length > 0;
  const escapeHTML = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function safeURL(value) {
    try { const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : null; }
    catch (_) { return null; }
  }
  function defaultState() { return {app:APP, schemaVersion:1, read:[], starred:[], answers:{}, font:0}; }
  function toggle(state, key, id) {
    if (!['read','starred'].includes(key)) throw new Error('不支援的進度類型');
    const items = state[key];
    return {...state, [key]:items.includes(id) ? items.filter(x=>x!==id) : [...items,id]};
  }
  function score(unit, answers) {
    const out = {total:unit.quiz.length, answered:0, correct:0, wrong:[]};
    unit.quiz.forEach(q => {
      const selected = answers[`${unit.id}/${q.id}`];
      if (!q.options.some(o=>o.id===selected)) return;
      out.answered++;
      if (selected===q.answer) out.correct++; else out.wrong.push(q.id);
    });
    return out;
  }
  const normalize = value => String(value ?? '').normalize('NFKC').toLowerCase().trim();
  function search(data, query) {
    const tokens = normalize(query).split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];
    const hits = [];
    data.units.filter(u=>u.status==='published').forEach(u=>{
      const matches = value => tokens.every(t=>normalize(value).includes(t));
      const head = [u.title,u.chapter,u.publisher,u.summary,...u.tags].join(' ');
      let found = false;
      u.concepts.forEach(c=>{
        if(matches([head,c.title,c.lead,...c.body].join(' '))) {
          hits.push({unit:u.id,concept:c.id,title:c.title,snippet:c.lead,chapter:u.chapter}); found=true;
        }
      });
      if(!found && matches(JSON.stringify(u))) hits.push({unit:u.id,concept:null,title:u.title,snippet:u.summary,chapter:u.chapter});
    });
    return hits;
  }
  function validateData(data) {
    const errors=[];
    if (!object(data) || !Array.isArray(data.units) || !Array.isArray(data.sources) || !Array.isArray(data.subjects)) return ['資料必須包含 units、sources、subjects'];
    const sourceIds=new Set(), unitIds=new Set(), subjectIds=new Set();
    data.subjects.forEach(s=>{if(!object(s)||!ID.test(s.id)||!text(s.name)||subjectIds.has(s.id))errors.push('subject invalid');else subjectIds.add(s.id);});
    data.sources.forEach(s=>{if(!object(s)){errors.push('source invalid');return;}if(!text(s.id)||sourceIds.has(s.id)||!safeURL(s.url)||!text(s.title)) errors.push(`source invalid: ${s.id}`);sourceIds.add(s.id);});
    const checkRefs=(refs,at)=>{
      if(!Array.isArray(refs)||!refs.length) errors.push(`source missing: ${at}`);
      else refs.forEach(s=>{if(!sourceIds.has(s)) errors.push(`source unknown: ${at}/${s}`);});
    };
    data.units.forEach(u=>{
      if(!object(u)){errors.push('unit invalid');return;}
      if(!Array.isArray(u.tags)||!u.tags.every(text))errors.push(`tags invalid: ${u.id}`);
      if(!ID.test(u.id)||unitIds.has(u.id)) errors.push(`duplicate or invalid unit: ${u.id}`);unitIds.add(u.id);
      if(!subjectIds.has(u.subject)) errors.push(`subject unknown: ${u.id}`);
      ['title','chapter','publisher','summary'].forEach(k=>{if(!text(u[k])) errors.push(`${u.id} missing ${k}`);});
      if(![7,8,9].includes(u.grade)||![1,2].includes(u.semester)) errors.push(`grade/semester invalid: ${u.id}`);
      if(!['draft','published'].includes(u.status)) errors.push(`status invalid: ${u.id}`);
      if(!Array.isArray(u.concepts)||!u.concepts.length||!Array.isArray(u.quiz)||!u.quiz.length) {errors.push(`empty concepts/quiz: ${u.id}`);return;}
      const cids=new Set(), qids=new Set();
      u.concepts.forEach(c=>{
        if(!object(c)){errors.push('concept invalid');return;}
        if(!ID.test(c.id)||cids.has(c.id)) errors.push(`duplicate concept: ${u.id}/${c.id}`);cids.add(c.id);
        if(!text(c.title)||!text(c.lead)||!Array.isArray(c.body)||!c.body.every(text)) errors.push(`concept text invalid: ${u.id}/${c.id}`);
        checkRefs(c.sources,`${u.id}/${c.id}`);
      });
      u.quiz.forEach(q=>{
        if(!object(q)){errors.push('question invalid');return;}
        if(!ID.test(q.id)||qids.has(q.id)) errors.push(`duplicate question: ${u.id}/${q.id}`);qids.add(q.id);
        if(!cids.has(q.concept)||!text(q.question)) errors.push(`question invalid: ${u.id}/${q.id}`);
        if(!Array.isArray(q.options)||q.options.length<2) {errors.push(`options missing: ${q.id}`);return;}
        const opts=new Set();
        q.options.forEach(o=>{if(!object(o)){errors.push(`option invalid: ${q.id}`);return;}if(!ID.test(o.id)||opts.has(o.id)||!text(o.text)||!text(o.explanation)) errors.push(`option invalid: ${q.id}`);opts.add(o.id);});
        if(!opts.has(q.answer)) errors.push(`answer invalid: ${u.id}/${q.id}`);

<script>
/* Knowledge Station: data-driven, dependency-free, local-only study UI. */
(() => {
  'use strict';
  const C = window.StudyCore;
  const D = window.STUDY_DATA;
  const $ = (s, scope = document) => scope.querySelector(s);
  const main = $('#main');
  if (!C || !D) return;
  const errors = C.validateData(D);
  const E = C.escapeHTML;
  if (errors.length) {
    main.innerHTML = `<div class="empty"><h1>教材資料需要修正</h1><p>${E(errors.join('；'))}</p><p>請恢復上一份有效資料後再開啟。</p></div>`;
    return;
  }
  const KEY = 'jh-study-notes.progress.v1';
  const units = D.units.filter(u => u.status === 'published');
  const sources = new Map(D.sources.map(s => [s.id, s]));
  const tabs = [['notes','重點整理'], ['diagrams','圖解比較'], ['traps','易錯觀念'], ['quiz','自我檢測'], ['quick','考前三分鐘']];
  let state = C.defaultState();
  let persistent = true;
  let storageConflict = false;
  let route = {view:'home'};
  let noticeTimer;
  const sessions = new Map();

  function warnStorage(message) {
    $('#storage-warning').hidden = false;
    $('#storage-warning').textContent = message;
  }
  try {
    const raw = window.localStorage.getItem(KEY);
    if (raw) {
      try { state = C.validateBackup(JSON.parse(raw), D); }
      catch (_) {
        storageConflict = true;
        persistent = false;
        warnStorage('原有進度格式與目前教材不符，尚未覆寫。現在使用暫存模式；可在「使用與備份」匯出暫存進度或匯入有效備份。');
      }
    }
  } catch (_) {
    persistent = false;
    warnStorage('此瀏覽器目前不允許儲存進度。閱讀與測驗仍可使用；離開前請至「使用與備份」匯出進度。');
  }
  function toast(message) {
    const n = $('#notice'); n.textContent = message; n.classList.add('visible');
    clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.remove('visible'), 4200);
  }
  function save() {
    if (!persistent) return;
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (_) {
      persistent = false;
      warnStorage('進度儲存失敗（可能是空間不足或瀏覽器限制）。目前進度仍在本頁，請先匯出備份再離開。');
    }
  }
  function setFont() { document.documentElement.dataset.font = String(state.font); }
  setFont();
  function sourceLine(ids) {
    const links = [...new Set(ids)].map(id => {
      const s = sources.get(id), url = s && C.safeURL(s.url);
      return url ? `<a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(s.title)}</a>` : '';
    }).filter(Boolean);
    return links.length ? `<div class="source-line">資料參考：${links.join(' · ')}</div>` : '';
  }
  function subjectName(u) { return D.subjects.find(s=>s.id===u.subject)?.name || '學科'; }
  function gradeLabel(u) { return ({7:'七',8:'八',9:'九'}[u.grade] || u.grade)+'年級'+(u.semester===1?'上':'下')+'學期'; }
  function unitLabel(u, separator=' · ') { return subjectName(u)+(u.domain&&u.domain!==subjectName(u)?separator+u.domain:'')+' '+u.chapter; }
  function hitLabel(h) {const u=units.find(u=>u.id===h.unit);return u?unitLabel(u):h.chapter;}
  function unitURL(u, tab='notes') { return `#/unit/${u.id}/${tab}`; }
  function getUnit() { return units.find(u => u.id === route.id); }
  function routeFromHash() {
    const hash = location.hash.slice(1) || '/home';
    const [path, query=''] = hash.split('?');
    const parts = path.split('/').filter(Boolean);
    const result = {view:parts[0] || 'home', id:parts[1], tab:parts[2] || 'notes', params:new URLSearchParams(query)};
    if (result.view === 'unit' && !tabs.some(t => t[0] === result.tab)) result.tab = 'notes';
    return result;
  }
  function navigate(hash) {
    if (location.hash === hash) render(); else location.hash = hash;
  }
  function navigation() {
    const active = type => route.view === type ? ' active' : '';
    $('#sidebar').innerHTML = `<a href="#/home" class="brand"><span class="brand-mark">知</span><span><span class="brand-name">知識小站</span><span class="brand-sub">STUDY NOTES</span></span></a>
      <div class="nav-group"><div class="nav-label">我的學習</div>
      <a class="nav-item${active('home')}" href="#/home"><span class="nav-icon">⌂</span>學習首頁</a>
      <a class="nav-item${active('review')}" href="#/review"><span class="nav-icon">☆</span>我的複習<span class="end">${state.starred.length}</span></a></div>
      <div class="nav-group"><div class="nav-label">學科目錄</div>${D.subjects.map(s => {
        const ready = units.some(u => u.subject === s.id);
        return ready ? `<a class="nav-item${(route.view === 'unit' || route.view === 'subject') && (getUnit()?.subject === s.id || route.id === s.id) ? ' active':''}" href="#/subject/${E(s.id)}"><span class="nav-icon">${E(s.short)}</span>${E(s.name)}<span class="end">${units.filter(u=>u.subject===s.id).length}</span></a>` : `<div class="nav-item dim" aria-disabled="true"><span class="nav-icon">${E(s.short)}</span>${E(s.name)}<span class="end">待新增</span></div>`;
      }).join('')}</div><div class="sidebar-bottom"><a class="nav-item${active('help')}" href="#/help"><span class="nav-icon">☷</span>使用與備份</a><div class="local-note">進度只存在這個瀏覽器<br>定期備份，安心複習。</div><div class="version-line">V${E(D.appVersion)} · ${E(D.updated)}</div></div>`;
    $('#mobile-nav').innerHTML = [['home','⌂','首頁'],['review','☆','複習'],['search','⌕','搜尋'],['help','☷','使用說明']].map(([id,icon,label])=>`<a href="#/${id}" class="${route.view===id?'active':''}"><span aria-hidden="true">${icon}</span>${label}</a>`).join('');
    const labels = {home:'學習首頁',review:'我的複習',search:'搜尋教材',help:'使用與備份',subject:'學科目錄'};
    $('#breadcrumb').textContent = route.view === 'unit' ? (getUnit()?unitLabel(getUnit(),' ／ '):'學習章節') : labels[route.view] || '知識小站';
  }
  function heading(title, description='') {
    return `<div class="section-heading"><h2>${E(title)}</h2>${description ? `<p>${E(description)}</p>` : ''}</div>`;
  }
  function unitCard(u) {
    const s = C.score(u, state.answers);
    return `<article class="unit-card" data-unit-card="${u.id}"><a href="${unitURL(u)}" class="unit-cover ${u.tone==='blue'?'blue':''}" aria-label="開啟${E(u.chapter+' '+u.title)}"><span class="eyebrow">${E(subjectName(u)+(u.domain?" · "+u.domain:""))}</span><span class="chapter-number">${E(u.chapter)}</span><span class="cover-symbol" aria-hidden="true">${u.tone==='blue'?'↟':'☘'}</span></a>
      <div class="unit-card-body"><div class="badge-row"><span class="badge green">${E(gradeLabel(u))}</span><span class="badge">${E(u.publisher)}</span></div><h3><a href="${unitURL(u)}">${E(u.title)}</a></h3><p>${E(u.summary)}</p><div class="tag-row">${u.tags.map(x=>`<span class="tag">${E(x)}</span>`).join('')}</div></div>
      <div class="unit-card-foot"><span>${state.read.includes(u.id)?'✓ 已讀完':`${u.concepts.length} 個重點 · 約 ${u.minutes} 分鐘`}${s.answered ? ` · 測驗 ${s.correct}/${s.total}`:''}</span><a href="${unitURL(u)}">開始學習 <span aria-hidden="true">↗</span></a></div></article>`;
  }
  function home(subject) {
    const showing = subject ? units.filter(u => u.subject === subject.id) : units;
    const readCount = units.filter(u=>state.read.includes(u.id)).length;
    const answerCount = units.reduce((n,u)=>n+C.score(u,state.answers).answered,0);
    return `<div data-view="home"><div class="intro-line"><strong>今天，也讀懂一點點。</strong><span>國中學習重點庫 · V${E(D.appVersion)}</span></div>
      ${!subject ? `<section class="hero"><div><div class="eyebrow">YOUR EVERYDAY STUDY SPACE</div><h1>把重點讀懂，</h1><div class="hero-second">把觀念記牢。</div><p class="desc">把一章拆成幾個小重點。<br>用圖解串起觀念，用測驗確認真的懂了。</p><a href="${unitURL(units.find(u=>!state.read.includes(u.id)) || units[0])}" class="btn primary">開始今天的學習 <span class="arrow">↗</span></a></div><div class="hero-art" aria-hidden="true"><div class="sun">☼</div><div class="paper-card"><div class="paper-top">BIOLOGY NOTES <span>3-3</span></div><h3>一束光，一份養分。</h3><div class="paper-equation"><span>水＋CO₂</span><b>↓ 光</b><strong>葡萄糖＋O₂</strong></div><div class="paper-note">先分清楚原料，再記住產物。</div></div><div class="sticky-note">讀懂，比背熟更重要。</div></div></section>
      <section class="stats" aria-label="學習概況"><div class="stat"><span class="stat-symbol">▤</span><div><strong>${units.length} <small>個章節</small></strong><p>已備好重點與圖解</p></div></div><div class="stat"><span class="stat-symbol">✓</span><div><strong>${readCount} <small>個已讀完</small></strong><p>依你的步調，一節一節來</p></div></div><div class="stat"><span class="stat-symbol">✎</span><div><strong>${answerCount} <small>題已練習</small></strong><p>每題都有完整解析</p></div></div></section>` : ''}
      <div class="section-top"><div><h2>${subject ? E(subject.name)+'學習目錄' : '從這一章開始'}</h2><p>選一節重點，讓今天的學習有個小成果。</p></div><span class="badge">第一批 · 生物 3-3 / 4-2</span></div>
      <div class="chips"><a href="#/home" class="chip ${!subject?'active':''}">全部 ${units.length}</a>${D.subjects.map(s=>units.some(u=>u.subject===s.id)?`<a href="#/subject/${s.id}" class="chip ${subject?.id===s.id?'active':''}">${E(s.name)}</a>`:`<span class="chip dim">${E(s.name)} · 待新增</span>`).join('')}</div>
      <div class="unit-grid">${showing.map(unitCard).join('')}</div>
      <div class="two-tips"><section class="tip-box"><div class="eyebrow">A SMALL ROUTINE</div><h3>不用一次背完，先走完三步。</h3><div class="steps-inline"><span>① 看重點</span><span>② 懂圖解</span><span>③ 做檢測</span></div><p>遇到不熟的觀念，點選星號放進「我的複習」。</p></section><section class="tip-box"><div class="eyebrow">ONE TEMPLATE, MANY SUBJECTS</div><h3>同一個小站，持續累積各科。</h3><p>目前有生物兩節。其他科目尚未建立，之後可沿用同一套版型新增教材。</p><a href="#/help">查看內容版本與使用方式 ↗</a></section></div>
      <div class="version-note">${E(D.sourceNotice)} <a href="#/help">查看核對紀錄</a></div></div>`;
  }
  function conceptCard(u,c,i) {
    const key = `${u.id}/${c.id}`, saved=state.starred.includes(key);

  function diagram(d) {
    let body='';
    if (d.kind==='equation') {
      body=`<div class="condition-row">${d.conditions.map(x=>`<span class="condition">${E(x)}</span>`).join('')}</div><div class="equation-pair">${d.inputs.map(x=>`<div class="equation-box"><strong>${E(x[0])}</strong><span>${E(x[1])}</span></div>`).join('<b>＋</b>')}</div><div class="reaction-arrow" aria-label="轉變成">↓</div><div class="equation-pair outputs">${d.outputs.map(x=>`<div class="equation-box"><strong>${E(x[0])}</strong><span>${E(x[1])}</span></div>`).join('<b>＋</b>')}</div>`;
    } else if(d.kind==='layers') {
      body=`<div class="layers">${d.items.map(x=>`<div class="layer"><strong>${E(x[0])}</strong><span>${E(x[1])}</span></div>`).join('')}</div>`;
    } else if(d.kind==='flow') {
      body=`<div class="flow-list">${d.items.map(x=>`<div class="flow-node"><strong>${E(x[0])}</strong><span>${E(x[1])}</span></div>`).join('<div class="flow-arrow" aria-hidden="true">↓</div>')}</div>`;
    } else if(d.kind==='branches') {
      body=`<div class="branch-center"><strong>${E(d.center[0])}</strong><span>${E(d.center[1])}</span></div><div class="branch-label">經由 ${E(d.label)}，分送各處</div>${d.branches.map(x=>`<div class="branch-node"><strong>${E(x[0])}</strong><span>${E(x[1])}</span></div>`).join('')}`;
    }
    return `<section class="panel diagram"><h3>${E(d.title)}</h3>${body}<p class="diagram-note">${E(d.note)}</p>${sourceLine(d.sources)}</section>`;
  }
  function table(t) {
    return `<section class="panel"><h3>${E(t.title)}</h3><div class="table-scroll" tabindex="0" role="region" aria-label="${E(t.title)}"><table><thead><tr>${t.headers.map(x=>`<th scope="col">${E(x)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map((x,i)=>i===0?`<th scope="row">${E(x)}</th>`:`<td>${E(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="table-note">${E(t.note || '')}</p>${sourceLine(t.sources)}</section>`;
  }
  function experiment(x,i,print=false) {
    return `<details class="experiment"${i===0||print?' open':''}><summary>${E(x.title)}</summary><div class="experiment-content"><div class="experiment-question">想確認：${E(x.question)}</div>${x.steps.map((s,j)=>`<div class="step"><span>${j+1}</span><p>${E(s)}</p></div>`).join('')}<div class="answer-box"><strong>觀察結果</strong><p>${E(x.result)}</p></div><div class="answer-box blue"><strong>可以得到的結論</strong><p>${E(x.conclusion)}</p></div><div class="warning">注意：${E(x.warning)}</div>${sourceLine(x.sources)}</div></details>`;
  }
  function diagrams(u,print=false) {
    return `${heading('把觀念連成一張圖','箭頭看方向，比較表看差異；實驗要看控制變因。')}<div class="content-grid">${u.diagrams.map(diagram).join('')}</div>${u.tables.map(table).join('')}<div class="experiments">${heading('實驗怎麼看','先問改變了哪個條件，再判斷結果能支持什麼。')}${u.experiments.map((x,i)=>experiment(x,i,print)).join('')}</div>`;
  }
  function traps(u) {
    return `${heading('容易混淆的話，現在一次釐清','先想一遍對或錯，再看正確說法與原因。')}${u.traps.map(t=>`<article class="trap-card"><div class="trap-line"><span class="trap-symbol" aria-label="錯誤">×</span><p>${E(t.wrong)}</p></div><div class="trap-line right"><span class="trap-symbol" aria-label="正確">✓</span><p>${E(t.right)}</p></div><p class="trap-why">${E(t.why)}</p>${sourceLine(t.sources)}</article>`).join('')}`;
  }
  function quick(u) {
    return `${heading('考前三分鐘，再順一次','先遮住筆記回想，再對照這些關鍵句。')}<div class="quick-grid">${u.quick.map((t,i)=>`<div class="quick-line"><b>${String(i+1).padStart(2,'0')}</b><span>${E(t)}</span></div>`).join('')}</div><div class="mantra"><strong>能用自己的話說明，才算真正讀懂。</strong><p>覺得都會了？到「自我檢測」驗證看看。</p></div>`;
  }
  function session(u) {
    if (!sessions.has(u.id)) {
      const first = u.quiz.findIndex(q => !state.answers[`${u.id}/${q.id}`]);
      sessions.set(u.id,{ids:u.quiz.map(q=>q.id), index:first<0?0:first, selection:null, result:first<0});
    }
    return sessions.get(u.id);
  }
  function resultHTML(u) {
    const s = C.score(u,state.answers);
    return `<section class="panel quiz-result" data-quiz-result><div class="result-icon">${s.correct===s.total?'✓':'✎'}</div><div class="eyebrow">CHECK YOUR UNDERSTANDING</div><h2>這一輪，完成了！</h2><div class="result-score">${s.correct} / ${s.total}</div><p class="result-note">${s.correct===s.total?'全部答對。再用自己的話，把觀念說一遍吧。':`有 ${s.wrong.length} 題值得再想一遍。看看解析，練習把觀念補齊。`}</p><div class="result-actions">${s.wrong.length?'<button class="btn primary" data-action="retry-wrong">只重作錯題</button>':''}<button class="btn secondary" data-action="retry-all">全部重新練習</button><a class="btn ghost" href="${unitURL(u,'quick')}">看考前重點 ↗</a></div></section><div class="review-answers">${heading('每題解析','保留本次作答結果；重作後會更新，不是歷次成績紀錄。')}${u.quiz.map((q,i)=>{
      const a=state.answers[`${u.id}/${q.id}`], ans=q.options.find(o=>o.id===q.answer), selected=q.options.find(o=>o.id===a);
      return `<details class="experiment"><summary>${a===q.answer?'✓':'✎'} 第 ${i+1} 題 · ${a===q.answer?'答對':'待複習'}</summary><div class="experiment-content"><p class="question-text">${E(q.question)}</p><p>你的答案：${E(selected?.text || '尚未作答')}</p><div class="answer-box"><strong>正確答案：${E(ans.text)}</strong><p>${E(ans.explanation)}</p></div>${selected&&selected.id!==q.answer?`<div class="warning">${E(selected.explanation)}</div>`:''}<a href="${unitURL(u)}?concept=${q.concept}">回看對應重點 ↗</a>${sourceLine(q.sources)}</div></details>`;
    }).join('')}</div>`;
  }
  function quiz(u) {
    const s=session(u);
    if (s.result) return resultHTML(u);
    const q=u.quiz.find(q=>q.id===s.ids[s.index]);
    const key=`${u.id}/${q.id}`, submitted=state.answers[key];
    const selected=submitted || s.selection;
    const answer=q.options.find(o=>o.id===q.answer);
    const chosen=q.options.find(o=>o.id===selected);
    const correct=submitted===q.answer;
    const isLast=s.index===s.ids.length-1;
    return `${heading('不用急，先想清楚再作答','每題作答後顯示解析；答錯的，可以在結束後單獨重作。')}<section class="panel" data-quiz><div class="quiz-meta"><span>${s.ids.length===u.quiz.length?'章節自我檢測':'錯題重作'} · ${E(u.chapter)}</span><span>第 ${s.index+1} 題 / 共 ${s.ids.length} 題</span></div><div class="quiz-progress" aria-label="題目進度"><span style="width:${((s.index+1)/s.ids.length)*100}%"></span></div><h3 class="question-text">${E(q.question)}</h3><div class="options" role="group" aria-label="選擇一個答案">${q.options.map((o,i)=>{
      const cls=submitted?(o.id===q.answer?' correct':o.id===selected?' incorrect':''):(o.id===selected?' selected':'');
      return `<button type="button" class="option-btn${cls}" data-option="${E(o.id)}" aria-pressed="${o.id===selected}"${submitted?' disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${E(o.text)}</span>${submitted&&o.id===q.answer?'<span class="option-status">✓ 正解</span>':''}</button>`;
    }).join('')}</div>${submitted?`<div class="feedback${correct?'':' wrong'}" data-feedback role="status"><strong>${correct?'✓ 答對了':'再想一想：這題答錯了'}</strong><p>${E(chosen.explanation)}</p>${!correct?`<p><strong>正確答案：${E(answer.text)}</strong><br>${E(answer.explanation)}</p>`:''}<a href="${unitURL(u)}?concept=${q.concept}">回看這個觀念 ↗</a></div>`:''}<div class="quiz-controls"><span class="small-text muted">${E(q.origin)}</span>${submitted?`<button class="btn primary" data-action="next-question">${isLast?'查看結果':'下一題'} →</button>`:`<button class="btn primary" data-action="submit-answer"${selected?'':' disabled'}>確認答案 →</button>`}</div>${sourceLine(q.sources)}</section>`;
  }
  function unitPage(u) {
    return `<div data-view="unit"><a class="back-link" href="#/subject/${E(u.subject)}">← 回到${E(subjectName(u))}學習目錄</a><header class="unit-hero ${u.tone==='blue'?'blue':''}"><span class="watermark" aria-hidden="true">${E(u.chapter)}</span><div class="badge-row"><span class="badge">${E(unitLabel(u))}</span><span class="badge">${E(gradeLabel(u))}</span><span class="badge">${E(u.publisher)}</span></div><h1>${E(u.title)}</h1><p>${E(u.tagline)}</p><div class="actions"><button class="btn primary" data-action="read" aria-pressed="${state.read.includes(u.id)}">${state.read.includes(u.id)?'✓ 已讀完':'標記為已讀完'}</button><button class="btn secondary" data-action="print-open">▤ 列印本節</button></div></header><nav class="tabs" aria-label="章節內容">${tabs.map(([id,label])=>`<a href="${unitURL(u,id)}" class="tab${route.tab===id?' active':''}"${route.tab===id?' aria-current="page"':''}>${label}</a>`).join('')}</nav><div id="unit-content">${({notes,diagrams,traps,quick,quiz}[route.tab] || notes)(u)}</div><div class="content-end"><span>內容 V${E(u.version)} · 更新 ${E(u.updated)}</span><p>${E(u.reviewNote)}</p><a href="#/help">來源與版本說明 ↗</a></div></div>`;
  }
  function review() {
    const cards=[];
    units.forEach(u=>u.concepts.forEach((c,i)=>{
      if(state.starred.includes(`${u.id}/${c.id}`)) cards.push(`<div><p class="review-toolbar"><span>${E(unitLabel(u))}</span><a href="${unitURL(u)}?concept=${c.id}">回到本節 ↗</a></p>${conceptCard(u,c,i)}</div>`);
    }));
    return `<div data-view="review">${heading('我的複習','把還不熟的觀念留在這裡；讀懂後再點星號移除。')}${cards.length?`<div class="concept-grid">${cards.join('')}</div>`:`<div class="empty"><div class="empty-symbol">☆</div><h2>先收下一個想複習的重點</h2><p>在重點卡右上角點星號，就會出現在這裡。</p><a class="btn primary" href="#/home">回到學習首頁 →</a></div>`}</div>`;
  }
  function searchResults(query) {
    if(!query.trim()) return '<div class="empty"><div class="empty-symbol">⌕</div><h2>想到什麼觀念，就從這裡找。</h2><p>試試「光合作用」、「木質部」或「氣孔」。</p></div>';
    const hits=C.search(D,query);
    if(!hits.length) return `<div class="empty"><h2>沒有找到「${E(query)}」</h2><p>換個關鍵字試試。目前教材範圍為生物 3-3 與 4-2。</p></div>`;
    return `<p class="muted small-text">找到 ${hits.length} 個相關重點</p>${hits.map(h=>`<a class="search-result" href="#/unit/${E(h.unit)}/notes${h.concept?'?concept='+E(h.concept):''}"><span class="eyebrow">${E(hitLabel(h))}</span><h3>${E(h.title)}</h3><p>${E(h.snippet)}</p></a>`).join('')}`;
  }
  function searchPage() {
    const query=(route.params.get('q') || '').slice(0,100);
    return `<div data-view="search">${heading('搜尋教材','跨章節尋找相關觀念；不需要完整輸入課本標題。')}<div class="search-box"><label for="search-input" class="small-text">輸入關鍵字</label><input id="search-input" type="search" maxlength="100" value="${E(query)}" placeholder="例如：韌皮部" autocomplete="off"></div><div data-search-results aria-live="polite">${searchResults(query)}</div></div>`;
  }
  function help() {
    return `<div data-view="help">${heading('使用與備份','一個安靜的學習空間。沒有帳號、廣告或追蹤程式。')}<section class="panel help-section"><h3>先看懂，再練習</h3><p>每節提供重點整理、圖解比較、易錯觀念、自我檢測與考前三分鐘。重點卡的星號可以加入「我的複習」；「已讀完」是閱讀標記，不代表測驗全部答對。</p><p>測驗記錄的是每題最近一次已確認的答案。完成後可只重作錯題；重新練習會清除該範圍原答案。</p></section>
      <section class="panel help-section"><h3>進度備份與還原</h3><p>已讀、複習星號、測驗答案與字級，只保存在目前瀏覽器的本站空間。不同裝置、不同網址與離線檔案不會自動同步；清除網站資料或使用隱私模式也可能失去進度。</p><div class="answer-box"><strong>目前儲存狀態：${persistent?'瀏覽器本機儲存':'暫存模式（請匯出後再離開）'}</strong><p>匯入前會檢查檔案格式、章節與答案；確認後才取代目前進度。只接受本網站 JSON 備份，不接受課本照片或其他檔案。</p></div><div class="actions"><button class="btn primary" data-action="export">匯出進度備份</button><label class="btn secondary file-label">匯入進度備份<input id="backup-file" type="file" accept=".json,application/json" aria-label="匯入進度備份"></label></div><p class="small-text muted">每次離線與線上切換前建議備份。瀏覽器不允許儲存時仍可閱讀、練習、匯出。</p></section>
      <section class="panel help-section"><h3>教材範圍與版本</h3><div class="version-row"><strong>網站版本</strong><span>V${E(D.appVersion)} · ${E(D.updated)}</span></div><div class="version-row"><strong>首批範圍</strong><span>七上生物 3-3、4-2，翰林概念整理</span></div><div class="warning">${E(D.sourceNotice)}</div><p>版本核對更正：先前對話引用的永和國中頁面，標題是「113學年度教科書版本」，不能據此認定為115學年度。未取得實際課本目錄或115正式選書公告前，本站不宣稱已核實當年度版本，也不標示未核對的頁碼。</p>${sourceLine(['school-old'])}<p>所有文字、示意圖與測驗以自主學習整理呈現，並非出版社頁面重製或官方考題。教材來源可供核對，但不代表學校或出版社對本站背書。生物構造示意不按實際比例繪製。</p></section>
      <section class="panel help-section"><h3>未來怎麼加入各科？</h3><p>採用「共用網頁＋分章教材資料」。在 data/units 加入通過校核的章節 JSON，再更新 catalog 的 unitFiles，執行建置即可沿用這套版型。各科需分別核對出版社、年級與範圍；沒有教材的科目不會顯示可點的空白章節。</p><p>GitHub 套件內附 README、章節模板、欄位說明及測試。第一版不包含網站內上傳課本自動辨識、登入或跨裝置雲端同步。</p></section>
      <section class="panel help-section"><h3>資料與隱私</h3><p>網站不要求學生姓名、班級或成績單，不上傳瀏覽器進度。點擊外部來源連結才會開啟第三方網站。正式發布到 GitHub Pages 時，不應加入含學生個資的試卷影像。</p><p>列印功能會完整展開本節，可選擇附上測驗解析。瀏覽器提供的「另存為 PDF」是列印選項，不是額外的雲端服務。</p></section>
      <section class="panel help-section"><h3>查核與參考來源</h3><p class="small-text muted">查閱日期 ${E(D.updated)}。教材使用對應教育與生物學資料；學校頁面僅作歷史版本說明。</p>${D.sources.map(s=>`<div class="source-item"><a href="${E(C.safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${E(s.title)} ↗</a><p>${E(s.note || '')}</p></div>`).join('')}</section></div>`;
  }
  function notFound() {
    return '<div class="empty"><div class="empty-symbol">⌂</div><h1>找不到這個章節</h1><p>這個連結可能已變更，或教材尚未建立。回到首頁選擇目前可讀的章節。</p><a href="#/home" class="btn primary">回到首頁 →</a></div>';
  }
  function render() {
    route=routeFromHash(); navigation();
    const u=getUnit();
    if(route.view==='home') main.innerHTML=home();
    else if(route.view==='unit'&&u) main.innerHTML=unitPage(u);
    else if(route.view==='review') main.innerHTML=review();
    else if(route.view==='search') main.innerHTML=searchPage();
    else if(route.view==='help') main.innerHTML=help();
    else if(route.view==='subject') {
      const subject=D.subjects.find(s=>s.id===route.id);
      main.innerHTML=subject&&units.some(u=>u.subject===subject.id)?home(subject):'<div class="empty"><h1>這一科的教材尚未建立</h1><p>目前可以先閱讀自然科的生物兩節。</p><a class="btn primary" href="#/home">回首頁</a></div>';
    } else main.innerHTML=notFound();
    document.title=u&&route.view==='unit'?`${u.chapter} ${u.title}｜知識小站`:'知識小站｜國中學習重點庫';
    window.scrollTo(0,0);
    const target=route.params.get('concept');
    if(u&&route.tab==='notes'&&u.concepts.some(c=>c.id===target)) {
      requestAnimationFrame(()=>document.getElementById('concept-'+target)?.scrollIntoView({block:'start'}));
    }
  }
  function renderQuiz(u) { $('#unit-content').innerHTML=quiz(u); }
  function resetQuiz(u,onlyWrong) {
    const ids=onlyWrong?C.score(u,state.answers).wrong:u.quiz.map(q=>q.id);
    if(!ids.length) return;
    const answers={...state.answers}; ids.forEach(id=>delete answers[`${u.id}/${id}`]);
    state={...state,answers}; save();
    sessions.set(u.id,{ids,index:0,selection:null,result:false}); renderQuiz(u);
  }
  function exportBackup() {
    const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download=`知識小站_進度_${new Date().toISOString().slice(0,10)}.json`;a.style.display='none';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已提出備份下載，請確認檔案已儲存。');
  }
  async function importBackup(file,input) {
    if(!file) return;
    try {
      if(file.size>1024*1024) throw new Error('備份檔案過大；原有進度未變更。');
      const next=C.validateBackup(JSON.parse(await file.text()),D);
      if(!window.confirm('要以這份備份取代目前的已讀、複習與作答紀錄嗎？尚未匯出的進度會被取代。')) return;
      state=next;sessions.clear();setFont();
      if(storageConflict) {persistent=true;storageConflict=false;$('#storage-warning').hidden=true;}
      save(); render(); toast('已還原進度備份。'+(!persistent?'目前仍為暫存模式。':''));
    } catch (_) { toast('備份格式或教材版本不符；原有進度未變更。'); }
    finally { if(input) input.value=''; }
  }
  function printContent(u,withAnswers) {
    const qs=u.quiz.map((q,i)=>`<section class="print-question"><h3>${i+1}. ${E(q.question)}</h3><p>${q.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${E(o.text)}`).join('\n')}</p>${withAnswers?`<div class="print-answer"><strong>參考答案：${String.fromCharCode(65+q.options.findIndex(o=>o.id===q.answer))}</strong>${q.options.map((o,j)=>`<p>${String.fromCharCode(65+j)}：${E(o.explanation)}</p>`).join('')}</div>`:''}</section>`).join('');
    return `<header class="print-header"><h1>${E(u.chapter+' '+u.title)}</h1><p>知識小站 · ${E(u.publisher)} · V${E(D.appVersion)} · ${E(D.updated)}</p><p>學校115學年度選書、實際頁碼與教師範圍待核對。</p></header><section class="print-section">${notes(u)}</section><section class="print-section">${diagrams(u,true)}</section><section class="print-section">${traps(u)}</section><section class="print-section">${quick(u)}</section><section class="print-section"><h2>自我檢測</h2>${qs}</section>`;
  }
  document.addEventListener('click',e=>{
    const star=e.target.closest('[data-star]');
    if(star) {
      const key=star.dataset.star;
      if(!units.some(u=>u.concepts.some(c=>`${u.id}/${c.id}`===key))) return;
      state=C.toggle(state,'starred',key); save();
      if(route.view==='review') {const y=window.scrollY;render();window.scrollTo(0,y);}
      else {
        const selected=state.starred.includes(key);
        star.classList.toggle('saved',selected);star.setAttribute('aria-pressed',String(selected));star.textContent=selected?'★':'☆';
        star.setAttribute('aria-label',star.getAttribute('aria-label').replace(selected?'加入複習':'移除複習',selected?'移除複習':'加入複習'));
        navigation();
      }
      toast(state.starred.includes(key)?'已加入「我的複習」':'已移出複習清單');return;
    }
    const option=e.target.closest('[data-option]');
    const u=getUnit();
    if(option&&u&&route.tab==='quiz') {
      const s=session(u), q=u.quiz.find(q=>q.id===s.ids[s.index]);
      if(!state.answers[`${u.id}/${q.id}`]&&q.options.some(o=>o.id===option.dataset.option)) {
        s.selection=option.dataset.option;renderQuiz(u);
        $(`[data-option="${s.selection}"]`)?.focus({preventScroll:true});
      }
      return;
    }
    const button=e.target.closest('[data-action]');if(!button) return;
    switch(button.dataset.action) {
      case 'font': state={...state,font:(state.font+1)%3};setFont();save();toast(['字級：標準','字級：加大','字級：特大'][state.font]);break;
      case 'read': if(u) {state=C.toggle(state,'read',u.id);save();button.textContent=state.read.includes(u.id)?'✓ 已讀完':'標記為已讀完';button.setAttribute('aria-pressed',String(state.read.includes(u.id)));toast(state.read.includes(u.id)?'已標記本節讀完':'已取消讀完標記');}break;
      case 'submit-answer': if(u) {
        const s=session(u),q=u.quiz.find(q=>q.id===s.ids[s.index]);
        if(!s.selection || state.answers[`${u.id}/${q.id}`]) break;
        state={...state,answers:{...state.answers,[`${u.id}/${q.id}`]:s.selection}};save();renderQuiz(u);$('[data-feedback]')?.scrollIntoView({block:'nearest'});
      } break;
      case 'next-question': if(u) {
        const s=session(u),q=u.quiz.find(q=>q.id===s.ids[s.index]);if(!state.answers[`${u.id}/${q.id}`]) break;
        if(s.index>=s.ids.length-1) s.result=true;else {s.index++;s.selection=null;}
        renderQuiz(u);$('#unit-content').scrollIntoView({block:'start'});
      } break;
      case 'retry-wrong': if(u) resetQuiz(u,true);break;
      case 'retry-all': if(u&&window.confirm('重新練習本節全部題目？這會清除本節已確認的作答。')) resetQuiz(u,false);break;
      case 'export': exportBackup();break;
      case 'print-open': if(u) {$('#print-answers').checked=false;$('#print-dialog').showModal();}break;
      case 'print-close': $('#print-dialog').close();break;
      case 'print-go': if(u) {$('#print-root').innerHTML=printContent(u,$('#print-answers').checked);$('#print-dialog').close();window.print();}break;
    }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='search-input') $('[data-search-results]').innerHTML=searchResults(e.target.value.slice(0,100));
  });
  document.addEventListener('change',e=>{if(e.target.id==='backup-file') importBackup(e.target.files[0],e.target);});
  $('#header-search').addEventListener('submit',e=>{e.preventDefault();navigate('#/search?q='+encodeURIComponent($('#global-search').value.trim().slice(0,100)));});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();});
  window.addEventListener('hashchange',render);
  // Browser print shortcuts should produce the same complete chapter notes.
  window.addEventListener('beforeprint',()=>{const u=getUnit();if(u&&!$('#print-root').textContent.trim())$('#print-root').innerHTML=printContent(u,false);});
  window.addEventListener('afterprint',()=>{$('#print-root').innerHTML='';});
  render();
})();

</script>
</body></html>
