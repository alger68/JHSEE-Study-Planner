'use strict';
const subjects=[['chinese','國文'],['english','英語'],['math','數學'],['science','自然'],['social','社會'],['health','健康與體育'],['arts','藝術'],['integrated','綜合活動'],['technology','科技']].map(([id,name])=>({id,name}));
const units=[];
function add(subject,grade,term,title,notes,scene){units.push({id:`${subject}-${grade}-${term}`,subject,grade,term,title,points:notes.trim().split('\n').map((s,i)=>{const [name,body]=s.split('::');return{id:'c'+i,name,body};}),scene:{stem:scene[0],options:scene.slice(1,5),answer:0,explanation:scene[5]},mapping:'跨版本核心主題；建議學期分組，非正式課本目錄'});}
add('chinese',7,1,'閱讀、敘事與修辭',`
主旨::把全文最主要的意思統整成一句話；不要把單一例子當成整篇主旨。
記敘要素::讀故事可整理人物、時間、地點、事件起因、經過與結果，建立事情的發展脈絡。
譬喻::利用兩種事物的相似處作比較；「雲像棉花」用棉花的外觀描寫雲。
擬人::把非人的事物寫得具有人的動作或情感；「路燈守候旅人」讓路燈像人。
語境::同一詞語在不同句子中可能意思不同，應結合前後文判斷，不只套第一個字義。`,['「雨滴敲著窗，催我起床。」主要用了哪種修辭？','擬人','引用','排比','回文','雨滴被寫成會催促人的角色，因此是擬人，不是引用他人話語。']);
add('chinese',7,2,'詩文、段落與表達',`
感官描寫::透過視覺、聽覺、嗅覺、味覺或觸覺，使讀者能具體感受場景。
轉折關係::前後意思有轉向或相反，如「雖然下雨，但是活動照常」。轉折後常是作者強調處。
因果關係::區分原因與結果，如「因為連日乾旱，所以水位下降」；先後發生不一定有因果。
對偶::把字數相等、結構相近且意義相對或相關的兩句並列；不是所有兩句話都是對偶。
摘要::保留中心訊息與重要關係，刪去重複細節，用自己的話濃縮，不加原文沒有的結論。`,['摘要寫到「作者一定討厭旅行」，但原文只說那天很累，問題在哪？','加入原文證據不足的推論','摘要字數太少就必然錯','沒有逐字照抄','沒有列出所有標點','摘要須忠於原文；一次疲累不足以證明作者一概討厭旅行。']);
add('chinese',8,1,'文言文與人物判讀',`
文言實詞::文言文中承載主要意義的詞，常包括名詞、動詞與形容詞；要按上下文選字義。
文言虛詞::「之、其、而、以」等詞常表示關係或語氣，也可能有其他用法，不能永遠只用同一翻譯。
省略主語::文言句常省去前文可知的人物；翻譯時先找動作由誰做，再補成通順句子。
人物側寫::透過其他人的反應、場景與事件呈現人物特質，不一定直接寫「他很勇敢」。
文本證據::對人物或作者下判斷時，指出相應語句；有感覺不等於已有證據。`,['文中「乃歸」沒有直接寫誰回家，首先應怎麼做？','從前後文找行動者','一律補成皇帝','判定這句沒有意義','一律當成命令句','先辨識前後文的主語，才能合理補回省略成分。']);
add('chinese',8,2,'論說、結構與寫作',`
論點::作者想使讀者接受的主要主張；回答「作者主張什麼」。
論據::支持主張的事例、數據或理由；回答「憑什麼這樣主張」。
論證::把理由與主張連接起來的推理過程；例子要真的能支持所談的結論。
段落銜接::運用代詞、關聯詞與前後主題連接句段，使讀者知道內容是延續、轉折或補充。
修改文章::先檢查立意、證據與結構，再修語句、用字與標點；改漂亮不等於改正確。`,['「我認為應設閱讀角；班級調查顯示多數同學缺安靜閱讀處。」後一句的作用？','提供支持主張的論據','改變故事人稱','交代小說結局','證明所有學校都相同','調查資料在此用來支持班級需求，不能直接外推到所有學校。']);
add('chinese',9,1,'比較閱讀與觀點',`
觀點比較::閱讀兩篇文章時，分別記下議題、立場與理由，再找相同與相異，不只比字數。
事實與意見::可查核的描述與個人評價要分開；「今天下雨」和「下雨真討厭」性質不同。
象徵::具體形象在文本中承載抽象意義；須依作品語境理解，不把所有意象套成固定答案。
反諷::字面意思與實際要表達的意思形成反差；判斷時須有情境或語氣支持。
語氣判讀::從用詞、句式與上下文辨識讚賞、質疑或遺憾；驚嘆號並不只代表開心。`,['甲主張節水，乙討論改善漏水管線。合理的比較是？','兩者都可關注水資源，但處理方式不同','兩篇必然完全對立','乙一定反對節水','有不同例子就沒有共同點','先比較議題與作法，不能只因方法不同便認定立場對立。']);
add('chinese',9,2,'會考閱讀與整合寫作',`
資訊擷取::先確認題目要求，再從文字、圖表或註記找出直接相關資訊，避免只憑印象作答。
跨文本統整::整合不同文本時，要先確認時間、對象與名詞定義是否相同，再合併訊息。
合理推論::推論須由已知線索支持，力度不能超過證據；「可能」不能任意改成「必然」。
圖表閱讀::先看標題、單位、座標與圖例，再比較數值；截短座標可能放大視覺差異。
作文審題::圈出題目限制、對象與關鍵詞，再安排段落，讓事例確實回應題旨。`,['圖表甲記錄「每月總量」，乙記錄「每日平均」，能直接比數字大小嗎？','不能，須先統一時間基準','可以，數字大就一定更多','只看顏色即可','只要同一年就可以','兩張圖的統計時間基準不同，必須先換算或明確區分。']);
add('english',7,1,'be動詞、名詞與問句',`
be動詞::現在式常用 I am、you/we/they are、he/she/it is；主詞變化時，動詞要一起檢查。
名詞單複數::可數名詞多於一個通常要用複數形；a book 和 two books 的名詞形式不同。
指示詞::this/that 配單數，these/those 配複數；也要注意遠近和 be 動詞一致。
所有格::my、your、his、her、our、their 通常放在名詞前，表示所屬關係。
疑問詞::who 問人、where 問地點、what 問事物；先看問題要問哪一種資訊。`,['These ___ my notebooks.','are','is','am','be','These 指複數事物，現在式 be 動詞用 are。']);
add('english',7,2,'日常活動、時間與數量',`
現在簡單式::描述習慣或一般事實；第三人稱單數肯定句的主要動詞通常加 s 或 es。
助動詞do::現在簡單式問句和否定句可用 do/does；用了 does 後，主要動詞回原形。
現在進行式::用 am/is/are 加 V-ing 表示此刻正在進行的活動；不要省略 be 動詞。
頻率副詞::always、usually、sometimes、never 描述頻率；常放一般動詞前、be 動詞後。
可數與不可數::many 常搭可數複數，much 常搭不可數名詞；問水量可用 how much water。`,['Does Mia ___ to school every day?','walk','walks','walking','walked','Does 已負責第三人稱單數形式，後面的動詞用原形 walk。']);
add('english',8,1,'過去、未來與不定詞',`
過去簡單式::描述已結束的過去事件；規則動詞常加 ed，不規則動詞需確認形式，如 go→went。
過去式否定::用 did not 加原形動詞；didn't go 正確，不能再把 go 寫成 went。
過去進行式::was/were 加 V-ing，表示過去某時正在進行的活動，常與另一事件搭配。
未來表達::will 加原形動詞；be going to 加原形動詞常表達計畫或依現況的預測。
動詞接續::want 後常接 to V；enjoy 後接 V-ing。不能把所有動詞套成同一接法。`,['Leo did not ___ the game yesterday.','watch','watched','watches','watching','did not 後接原形動詞 watch；yesterday 不會使這個動詞再變過去式。']);
add('english',8,2,'比較、感官與連接詞',`
比較級::比較兩者時常用比較級加 than；短形容詞常加 er，部分形容詞用 more。
最高級::在指定群體中比較時常用 the 加最高級；應讀清楚比較範圍。
同等比較::as 加形容詞原級加 as 表示同等程度，如 as tall as；中間不用 taller。
感官動詞::look、sound、smell、taste、feel 描述感受時可接形容詞，如 The soup smells good。
連接詞::because 引出原因，although 引出讓步；標準句型避免把 because…so 或 although…but 重複堆疊。`,['This box is as ___ as that one.','heavy','heavier','heaviest','more heavy','as…as 的中間用形容詞原級 heavy，而不是比較級。']);
add('english',9,1,'完成式、被動與關係子句',`
現在完成式::have/has 加過去分詞，連結過去事件與現在；明確已結束的過去時間通常用過去簡單式。
since與for::since 常接起點，for 常接持續長度；since Monday 與 for three days 意義不同。
被動語態::用 be 加過去分詞，讓承受動作的對象當主詞；be 的時態仍須符合情境。
關係子句::用 who、which、that 等連接對名詞的補充或限定描述，先確認被修飾的先行詞。
間接問句::問句放進較大句子後，常改為疑問詞加主詞加動詞，如 where he lives。`,['The window ___ by a ball yesterday.','was broken','is breaking','broke by','was broke','yesterday 指過去；窗戶承受打破的動作，用 was 加過去分詞 broken。']);
add('english',9,2,'條件句、閱讀與整合',`
未來條件句::表達可能的未來條件時，if 子句常用現在簡單式，主要子句可用 will 加原形動詞。
代名詞指涉::看到 it、they、this 等代名詞，回看前文找合理對象，同時核對單複數與語意。
上下文猜字::從定義、對比、例子與前後因果推測陌生字義，不只看字形相似。
閱讀推論::答案必須由文章支持；常識可能是真的，但未必回答這篇文章的問題。
通知資訊::讀告示或行程時，分開整理時間、地點、對象、條件與例外，特別注意否定詞。`,['If it ___ tomorrow, we will stay indoors.','rains','will rain','rained yesterday','raining','此處是可能的未來條件，if 子句用現在簡單式 rains。']);
add('math',7,1,'數與一元一次方程式',`
整數加減::減去一個數等於加上它的相反數；先保留括號與正負號，再計算。
分數運算::加減先通分，乘法分子分母分別相乘；除以非零分數等於乘它的倒數。
因數與倍數::因數能整除該整數；公因數同時整除兩數，最小公倍數則是兩數共同倍數中的最小正數。
指數記法::a的n次方表示n個a相乘；(-2)²＝4，而-2²＝-4，括號會改變計算範圍。
一元一次方程式::等號兩邊做相同合法運算仍保持相等；解出後代回原式檢驗。`,['3x＋5＝20，x等於多少？','5','15','25','3','等號兩邊減5得3x＝15，再除以3，x＝5；代回得20。']);
add('math',7,2,'比例、聯立與幾何',`
正比::兩量成正比時，y/x固定，可寫成y＝kx；不能只因兩量同增就判定正比。
二元一次聯立::找同時滿足兩個方程式的數對；代入法與加減消去法都要回代檢驗。
不等式::兩邊同乘或同除以負數時，不等號方向反轉；乘除正數則不反轉。
直角坐標::點寫成(x,y)，先看水平再看垂直；x與y對調一般會變成另一點。
面積與周長::面積量度平面範圍，周長量度邊界長度；長方形分別為長×寬與2×(長＋寬)。`,['-2x＞6，兩邊除以-2後得到？','x＜-3','x＞-3','x＜3','x＞3','除以負數時不等號要反向，所以得到x＜-3。']);
add('math',8,1,'多項式、根式與二次方程式',`
乘法公式::(a＋b)²＝a²＋2ab＋b²；平方和不能漏掉中間的2ab項。
平方根::非負數a的算術平方根記為√a；x²＝a在a＞0時有正負兩個解。
畢氏定理::直角三角形兩股平方和等於斜邊平方；一定先確認直角與斜邊位置。
因式分解::把多項式寫成因式的乘積，可用提公因式或公式；完成後展開檢查。
零乘積性質::若AB＝0，則A＝0或B＝0；二次方程式須先移項使一邊為0才可直接使用。`,['(x-2)(x-5)＝0的兩個解為？','2與5','-2與-5','0與7','只有10','乘積為0時至少一個因式為0，分別解得x＝2或x＝5。']);
add('math',8,2,'數列、函數與平面幾何',`
等差數列::相鄰兩項差固定為d，第n項為a₁＋(n-1)d；第一項到第n項只有n-1次間隔。
一次函數::y＝ax＋b的圖形是直線；a描述斜率，b是與y軸交點的y坐標。
三角形內角和::平面三角形三內角和為180°；外角等於不相鄰的兩內角和。
全等::形狀與大小都相同，對應邊與對應角相等；只知道三角相等只能判相似。
平行四邊形::兩組對邊分別平行，其對邊等長、對角相等，對角線互相平分。`,['等差數列首項4、公差3，第5項為？','16','19','15','12','第5項＝4＋(5-1)×3＝16；不是把公差加5次。']);
add('math',9,1,'相似、圓與二次函數',`
相似形::對應角相等、對應邊成比例；邊長比k時，面積比為k²，不是k。
圓周與圓面積::半徑r的圓，周長為2πr、面積為πr²；直徑等於2r。
圓周角::同弧所對的圓周角是圓心角的一半；先確認比較的是同一段弧。
圓的切線::切線與通往切點的半徑互相垂直；垂直條件要對準切點。
二次函數::y＝a(x-h)²＋k的頂點是(h,k)，對稱軸是x＝h；a正負決定開口方向。`,['相似三角形邊長放大3倍，面積變成幾倍？','9倍','3倍','6倍','27倍','面積比例是邊長比例的平方，3²＝9。']);
add('math',9,2,'統計、機率與空間',`
平均數::資料總和除以筆數；極端值可能明顯改變平均，因此不能單靠平均理解全部分布。
中位數::先排序再找中間位置；偶數筆時取中間兩數的平均，不是最大最小平均。
古典機率::在各結果等可能時，機率＝符合條件的結果數÷所有結果數；先確認等可能假設。
柱體體積::直柱體體積＝底面積×高；長方體是長×寬×高，單位要用立方。
模型檢驗::算出答案後核對單位、正負與情境限制；代數解不一定都適合實際問題。`,['資料2、3、4、7、24的中位數是多少？','4','8','13','24','排序後第3個數是4；8是平均數，不是中位數。']);
add('science',7,1,'細胞、養分與運輸',`
細胞::是生物構造與功能的基本單位；細胞膜控制物質進出，不同細胞構造會有差異。
光合作用::常見綠色植物在葉綠體利用光能，將水與二氧化碳製成有機養分；釋出的氧氣來自水。
植物運輸::木質部主要運水與無機鹽，韌皮部運有機養分；養分依來源與使用部位移動。
消化與吸收::消化把較大養分分解成可吸收的小分子；吸收是物質穿過消化道壁進入體內。
恆定性::生物藉調節維持體內條件相對穩定；不是所有數值永久不變。`,['葉片滴碘液變藍黑色，直接證明什麼？','檢驗時含有澱粉','直接驗出葡萄糖','所有葉細胞都有葉綠體','氧氣必然由二氧化碳分解而來','碘液檢驗澱粉。要進一步推論光的作用，仍須消除原有澱粉干擾並控制條件。']);
add('science',7,2,'生殖、遺傳與生態',`
有性生殖::涉及配子結合，子代遺傳組合可能與親代不同；不是必定比無性生殖快。
遺傳與環境::性狀可能同時受基因與環境影響；看到親子相似不代表所有性狀只由單一基因決定。
自然選擇::族群原有差異在環境中造成生存與繁殖差異，跨世代改變特徵比例；不是個體因需要立即進化。
食物網::多條食物鏈交織成網；能量沿攝食關係傳遞並散失，不能像物質一樣完全循環。
生物多樣性::包含基因、物種與生態系等層次；保護環境不只是在數物種名稱。`,['「動物因為需要飛，就在一生中長出翅膀。」問題在哪？','把族群跨世代改變誤當個體按需要改變','忽略動物一定不能繁殖','證明所有差異都後天形成','說明食物網只有一條鏈','自然選擇作用於既有差異，影響跨世代繁殖結果，不是有需要便立即長出構造。']);
add('science',8,1,'測量、波動與物質',`
測量與單位::數值必須搭配單位才有完整意義；先統一單位再計算，並注意量具解析度。
密度::密度＝質量÷體積；同物質在相近條件下，較大一塊不代表密度較大。
波的特徵::頻率描述每秒振動次數，振幅描述最大偏離；聲音音調主要與頻率有關。
光的反射::反射角等於入射角，兩角都從法線量起，不是從鏡面量起。
原子與分子::原子可組成分子；元素由同種原子構成，化合物含不同元素且有一定組成。`,['質量60g、體積20cm³的物體，密度是多少？','3g/cm³','1200g/cm³','40g/cm³','80g/cm³','密度＝60÷20＝3g/cm³；質量與體積不能相加。']);
add('science',8,2,'反應、酸鹼與力',`
質量守恆::在物質不進出的封閉系統內，化學反應前後總質量相同；氣體逸出會影響開放容器秤量。
酸鹼指示::指示劑顏色與酸鹼性相關；不能把所有指示劑的變色規則視為相同。
反應速率::可由單位時間的反應物減少或產物增加衡量；比較實驗須控制其他條件。
氧化還原::國中可先從氧的獲得與失去理解部分反應；更一般的判斷涉及電子轉移。
壓力::平均壓力＝垂直作用力÷受力面積；力相同時，接觸面積越小，壓力越大。`,['同重物放在相同材料上，接觸面積縮為一半，平均壓力如何？','變成2倍','變成一半','不變','變成4倍','力固定時，壓力與面積成反比，除以原先一半的面積便加倍。']);
add('science',9,1,'運動、能量與電路',`
平均速率::總路程除以總時間；平均速度則用位移除以時間，往返時兩者可能不同。
牛頓第二定律::質量固定時，合力與加速度關係為F＝ma；合力為零不代表一定靜止。
功::力沿位移方向時，功＝力×位移；沒有位移，即使費力也不代表對物體做了這種機械功。
歐姆定律::對符合歐姆定律且條件固定的元件，V＝IR；單位為伏特、安培與歐姆。
串並聯::串聯各元件電流相同，並聯各支路兩端電壓相同；不能混用兩種規則。`,['對符合歐姆定律的4Ω電阻施加12V，電流是多少？','3A','48A','16A','8A','由I＝V/R＝12/4＝3A，不能用電壓乘電阻。']);
add('science',9,2,'電磁、地球與宇宙',`
電磁感應::穿過線圈的磁通量改變時可產生感應電動勢；有磁鐵不代表一定有持續感應電流。
板塊運動::岩石圈分成板塊並相對移動，邊界常與地震、火山或造山活動相關。
天氣與氣候::天氣描述短時間的大氣狀態，氣候描述較長期的統計特性；單日寒冷不能直接否定長期趨勢。
月相::月球受太陽照亮的一面大致不變，地球觀測方向改變造成可見亮面比例變化，普通月相不是地球影子。
規模與震度::規模描述地震大小，震度描述各地搖晃程度；同次地震不同地點的震度可能不同。`,['同次地震甲地4級、乙地2級，是什麼不同？','兩地震度不同','同一震源同時具有兩個不同規模','月相不同造成規模改變','表示乙地沒有地震波','這是在比較兩地震度，不是把地震規模分成兩個。']);
add('social',7,1,'臺灣的地理與史料入門',`
相對位置::用某地與其他地點的方位或距離描述位置；會隨參照點改變。
絕對位置::用經緯度等坐標系統定位；讀坐標要確認東西經與南北緯。
等高線::連接相同海拔的點；在相同比例尺下，線越密通常坡越陡。
史料來源::閱讀歷史資料要查作者、時間、目的與背景，第一手資料也可能有立場或限制。
文化多樣::不同族群與社群可有不同生活方式；避免用單一印象代表所有成員。`,['同一張等高線圖，甲地線距比乙地密，通常表示？','甲地坡度較陡','甲地一定海拔較低','乙地一定有河流','兩地坡度必然相同','相同比例尺和等高距下，相同高度差在較短水平距離內完成，坡較陡。']);
add('social',7,2,'人口、產業與生活社會',`
人口密度::人口數除以面積，描述平均疏密；不能單憑總人口判定密度。
人口遷移::需分辨遷入與遷出，並從工作、交通、環境與家庭等條件分析，不只找單一原因。
產業分工::原料取得、加工製造與服務提供各有功能，同一商品往往連結多種產業。
社會規範::家庭、學校與社會中有不同規範；閱讀情境先確認適用對象與目的。
歷史變遷::比較不同時期的交通、產業與生活，區分延續與改變；發生較晚不代表由前事單獨造成。`,['甲地1000人、10km²；乙地1500人、30km²，何者密度較高？','甲地','乙地','兩地相同','只知道總人口就能確定乙地較高','甲100人/km²，乙50人/km²，須除以面積後再比較。']);
add('social',8,1,'區域比較與制度觀察',`
氣候圖::先讀月均溫曲線與降水量柱，分辨年溫差、雨季與乾季，不把兩個單位混讀。
區域差異::比較自然環境、人口與產業的組合；不能由同一國家推定所有地區條件相同。
制度變遷::分析規則或組織如何隨時代改變，並以史料比較前後，避免只靠朝代名稱背誦。
權利與責任::情境分析要同時注意個人可以主張什麼、對他人應負哪些責任。
證據互證::比較不同作者、不同類型資料是否相互支持；資料一致也要留意是否源自同一轉載。`,['三個網站逐字轉貼同一篇文章，能算三份獨立證據嗎？','不能，來源可能只有同一份','能，網址不同就一定獨立','能，字數越多越可靠','不能，網路資料全部不能用','要追查最初來源；多次轉載不會自動變成多份獨立證據。']);
add('social',8,2,'交流、貿易與公共議題',`
跨區交流::人口、商品與觀念可沿交通或貿易網流動；分析時同看交流管道與受到的影響。
供給與需求::價格變動要看供需條件；分析某一因素時，需說明其他條件是否不變。
機會成本::選擇某方案而放棄的最佳替代方案之價值，不是把所有放棄方案價值相加。
公共議題分析::分開整理議題事實、不同需求、方案與可能影響；評估資料品質而非只看聲量。
圖表基準::比較比率前確認分母、期間與樣本；高成長率不一定代表增加的絕對數較多。`,['讀書或練琴只能選一個時，選讀書的機會成本主要是？','放棄的練琴機會價值','兩件事情價值全部相加','已經買書的價錢必然等於機會成本','任何選擇都沒有成本','此情境只有一個最佳被放棄替代方案：練琴。']);
add('social',9,1,'世界區域與近代變遷',`
都市化::都市人口或都市生活影響擴大，分析時要看人口比例、空間與產業，不只數高樓。
工業化::生產組織與技術朝機械化等方式改變，會牽動勞動、交通與聚落；影響因地區而異。
全球連結::商品供應鏈可能跨越多地；一地變動能影響其他地方，不能只看最後組裝地。
史觀比較::作者選用的問題、材料與視角可能不同；比較解釋須回到具體證據。
地圖投影::把球面畫成平面必有某些變形，面積、角度或距離不能全部無失真。`,['世界地圖上某高緯度地區看起來很大，比較真實面積前應注意？','地圖投影可能造成面積變形','紙越大國土就越大','所有地圖面積都完全正確','只看顏色深淺','地圖投影有不同特性，不能直接用所有平面地圖的視覺面積比較真實大小。']);
add('social',9,2,'永續、文化與社會科整合',`
永續思考::同時考量環境、社會與經濟，以及當代與未來需求；不是只算短期收入。
文化理解::先理解行為的歷史與生活脈絡，再比較差異，避免以刻板印象取代資料。
資料可信度::看作者、方法、日期、原始資料與是否能核查，人氣高不等於內容正確。
因果辨識::兩件事相關不一定一方造成另一方，也可能受第三因素影響。
多尺度分析::同一議題可分個人、社區、區域與全球層次，避免把不同範圍資料直接混用。`,['冰品銷售與戲水人數同時增加，就能說吃冰造成戲水嗎？','不能，氣溫可能同時影響兩者','可以，相關必定就是因果','可以，不需其他證據','不能，任何資料都無法研究關係','共同的第三因素如氣溫可能影響兩者，需要更多研究才可支持因果。']);
add('health',7,1,'健康識讀與運動安全',`
健康資訊識讀::先檢查資訊來源、日期與證據，不把網路傳言當成個人診斷。
身體界線::每個人都可以表達不舒服與拒絕不適當接觸；尊重他人的意願與隱私。
暖身::正式運動前逐步增加活動，讓身體進入準備狀態；暖身不能保證完全不受傷。
活動補水::運動會流失水分，補水須依活動與環境調整，不以硬撐口渴作為訓練目標。
安全求助::明顯受傷或不舒服時應停止逞強並告知教師或可信任成人，必要時尋求醫療協助。`,['同學運動時突然明顯頭暈，課堂中較適合的處理？','停止活動並通知老師協助','要求他立刻衝刺','不告訴任何人','把不適當成一定正常','優先停止冒險活動並求助，不由同學自行猜診斷或要求硬撐。']);
add('health',7,2,'營養、體適能與合作',`
均衡飲食::攝取多樣食物並依個人需要調整；單一食物不能提供身體所需的一切。
營養標示::先看每份量及包裝份數，再計算實際吃下的量；一包不一定只是一份。
心肺耐力::與持續活動時供應及利用氧氣的能力有關，不能只靠一次短距離衝刺判定。
肌力與肌耐力::肌力偏向一次能施出的力量，肌耐力偏向持續或反覆出力的能力。
運動合作::分工、溝通與尊重規則能協助團隊完成目標，勝負不是唯一學習成果。`,['飲料每份糖10g、一瓶有2份，喝整瓶攝取糖多少？','20g','10g','5g','12g','實際攝取量＝每份10g×2份＝20g。']);
add('health',8,1,'訓練、恢復與情緒',`
循序漸進::活動負荷逐步增加並觀察反應，而非一次把強度與時間大幅提高。
恢復::訓練之間的休息與睡眠屬於訓練安排的一部分，不是越疲累越有進步。
情緒辨識::先分辨自己的感受及觸發情境，再選擇合宜表達，不把情緒等同於行動命令。
壓力因應::可透過安排時間、與可信任者討論及尋求協助處理壓力，不必獨自承擔所有困難。
動作回饋::觀察與修正動作時，聚焦具體姿勢與節奏，不用嘲笑身體外表代替技術指導。`,['練習連續多天越練越疲累，最應檢查哪項安排？','負荷與恢復是否平衡','如何把休息完全取消','怎樣忽略所有不適','如何只看別人的成績','應檢查訓練與恢復，而不是把疲累一律解讀為進步。']);
add('health',8,2,'人際、媒體與比賽策略',`
同儕壓力::別人的要求可能影響決定；先確認自己的意願、安全與界線，再選擇是否配合。
媒體身體形象::照片與影片可能經挑選、修圖或剪輯，不應視為所有人的身體標準。
拒絕技巧::清楚表達不願意、離開不安全情境並求助，拒絕不必以傷害自己為代價。
比賽策略::依場上位置、隊友與對手反應選擇行動，不是每次都重複同一招。
公平競賽::遵守共同規則、尊重參與者並以合宜方式處理爭議，不以作弊換取成績。`,['同學說「不敢做危險挑戰就不是朋友」，較合宜的回應？','拒絕危險要求，必要時離開並求助','為證明友情立刻照做','隱瞞受傷繼續挑戰','把所有責任交給起鬨的人','友情不能取代安全與自主界線；可拒絕並找成人協助。']);
add('health',9,1,'生活選擇與運動計畫',`
目標設定::把目標寫成具體可觀察的行動，再安排實行時間；不只寫「我要變強」。
訓練紀錄::記下內容、負荷與身體反應，才有依據比較調整，單次好壞不能代表長期趨勢。
風險評估::先查看場地、器材、天候與自身狀態，再選擇合適活動。
消費辨識::辨別產品宣稱、證據與廣告目的；價格高或名人推薦不等於必然適合自己。
心理求助::持續困擾影響生活時，可向師長、輔導人員或專業者求助，不以羞辱否定困難。`,['哪個學習目標最容易追蹤是否做到？','本週三天各完成10分鐘動作練習並記錄','永遠比所有人強','每天一定都很開心','明年再想要做什麼','第一項有時間、頻率、行動與紀錄，方便確認執行情況。']);
add('health',9,2,'終身活動與健康決策',`
終身活動::選擇能長期維持且適合自身條件的身體活動，而非只為一次測驗或比賽。
久坐中斷::安排活動間隔，減少長時間持續坐著；不能把一次運動當成其他時段完全不動的理由。
健康決策::先確認問題、取得可靠資訊、比較選項與後果，再評估結果，必要時請專業者協助。
尊重差異::不同身體條件與能力的人可用調整後的方式參與，不把差異當成排斥理由。
緊急應變::遇危急狀況先確保現場安全並求救，依受過的訓練與專業指示行動。`,['同一運動班有不同能力的學生，較合宜的安排？','調整難度與方式讓學生安全參與','所有人不論狀況都做同一最高強度','能力不同就一律排除','完全不需要任何安全規範','尊重差異可以透過負荷和方式調整落實；安全仍是共同要求。']);
add('arts',7,1,'視覺、音樂與表演入門',`
線條::方向、粗細與疏密可引導視線或形成節奏，不只用來描外框。
色彩三屬性::色相描述哪一類顏色，明度描述明暗，彩度描述鮮豔程度；三者不能混為一談。
節拍::音樂中有規律的時間脈動，可作為組織節奏的基礎。
節奏::音的長短與出現時機的組合；不同節奏可以建立在同一節拍上。
角色::表演中先理解人物身分、需求與處境，再決定動作與語氣。`,['把同一紅色逐漸加入白色，最直接可見哪項提升？','明度','節拍數','角色年齡','畫紙面積','加白通常使顏色更亮；明度是描述明暗的屬性。']);
add('arts',7,2,'構圖、旋律與舞台',`
構圖::安排畫面元素的位置、大小與關係，引導閱讀順序與重點。
留白::未放滿元素的空間也有作用，可突出主體並調整畫面節奏。
旋律::不同高低與長短的音依序形成樂句，不只是聲音大小變化。
力度::音樂的強弱變化可營造表情；和音高、速度是不同面向。
舞台調度::安排表演者的站位、移動與互動，使觀眾理解場景及人物關係。`,['海報標題、時間、地點全用同樣大小且擠在一起，最需要改善？','資訊層級與留白','只增加更多裝飾','把重要時間刪掉','把所有字再縮小','安排閱讀順序與空間，能幫助讀者先找到重要資訊。']);
add('arts',8,1,'空間、合奏與即興',`
透視::運用空間線索表現遠近；近大遠小是常見線索，但仍要看觀察位置。
明暗塑形::以亮面、暗面與陰影表現物體立體感，陰影方向應與光源相符。
音色::使人能分辨不同樂器或發聲方式的聲音特性，不等於音量大小。
合奏::同時注意自己的聲部與整體速度、音量和進入時機，需要傾聽其他人。
即興::在情境或規則內當下創作，仍需回應同伴與共同脈絡，不是完全沒有組織。`,['兩種樂器演奏相同音高、相近音量，仍可區分，主要依據？','音色','畫面透視','紙張明度','舞台台詞字數','不同樂器的聲音質地不同，這種特性稱音色。']);
add('arts',8,2,'設計、曲式與劇場合作',`
設計功能::先理解使用者與傳達目的，再決定形式；漂亮不代表資訊一定清楚。
視覺對比::運用大小、明暗、色彩或形狀差異形成重點，需配合內容目的。
曲式::音樂段落的組織方式；可從重複與對比辨認結構，如ABA。
劇場分工::演員、導演、燈光、音響與舞台等工作相互配合，影響整體呈現。
創作回饋::指出觀察到的特徵與效果，再提出具體修改建議，不只說好看或難看。`,['曲子第一段A、第二段B、最後回到A，結構可記為？','ABA','ABC','AAAA','只有B','最後回到最初材料，呈現A-B-A的重現結構。']);
add('arts',9,1,'媒體、文化與作品詮釋',`
藝術脈絡::理解作品時可考察創作時代、媒材與用途，不只看外觀或價格。
影像剪輯::鏡頭順序與長短能改變敘事節奏及觀眾推論，同一素材可被不同方式組合。
聲畫關係::音樂、環境聲與畫面可互相支持或形成反差，會影響觀看感受。
文化借用::創作參考不同文化時，需理解來源與脈絡並尊重原有意義，避免只截取刻板符號。
詮釋依據::說明作品感受時，連結具體形式或內容；不同解讀也需要作品線索支持。`,['同一風景畫面配輕快或緊張音樂，觀眾感受不同，說明什麼？','聲畫組合影響詮釋','畫面像素必然改變','兩種音樂的音高必然完全相同','影像不需要任何脈絡','聲音能提供情緒與敘事線索，影響對相同畫面的理解。']);
add('arts',9,2,'專題創作與展演',`
創作提案::先交代主題、對象、媒材與預期表達，再規劃執行，而非先堆滿效果。
作品集::整理作品、過程與反思，能呈現決策和進步，不只是最後成品照片。
展演動線::安排觀眾行走、觀看與停留方式，並注意安全與資訊可讀性。
自我評量::依原定目標與具體標準檢查作品，區分已達成與待修改部分。
授權標示::使用他人素材前查明許可與使用條件；註明作者不等於取得所有使用授權。`,['從網路取得一張照片，標作者姓名就一定可任意商用嗎？','不一定，仍須確認授權範圍','一定可以，署名即可','一定可以，圖片小就無限制','只要改色就不用管授權','署名與授權不同；使用範圍要按實際許可條件查明。']);
add('integrated',7,1,'自我認識與學習管理',`
自我觀察::從實際經驗記錄興趣、優勢與困難，避免只靠一次成績定義自己。
任務拆解::把大目標拆成可以開始的小步驟，再安排順序，降低不知道從哪做起的困難。
時間規劃::同時列出任務、可用時間與期限，預留調整空間，不把行程排到完全無緩衝。
傾聽::先理解對方真正意思，可用自己的話重述確認，不急著替對方下結論。
求助資源::認識可協助的師長、同學與校內資源；提出具體問題更容易獲得適當支援。`,['「準備報告」太大而遲遲沒開始，哪個第一步最具體？','先列三個要查的問題','等有完美想法才做','把期限忘掉','只責怪自己沒能力','可執行的小步驟讓工作有起點，之後再依進度調整。']);
add('integrated',7,2,'家庭生活與戶外合作',`
生活分工::共同生活需要協調任務、時間與能力，而非讓固定某人負責全部事情。
溝通表達::描述事實、自己的感受與需求，有助對方理解；避免用人身攻擊替代問題討論。
戶外準備::先確認路線、天候、裝備與聯絡方式，行程應符合參與者能力。
無痕行動::減少對環境的影響，妥善處理垃圾並尊重場域規定，不隨意留下物品。
合作規則::在活動前釐清角色、目標與決策方式，活動中仍需持續確認與調整。`,['小組出遊前最應先確認哪一組資訊？','路線、天候、能力與安全安排','按讚數和照片濾鏡','只看餐廳甜點','只看誰帶最新手機','戶外計畫先處理安全和執行條件，娛樂安排不能取代必要準備。']);
add('integrated',8,1,'生涯探索與價值選擇',`
生涯探索::蒐集不同學習與工作資訊並認識自己，逐步形成選擇，不必由一次測驗定終身。
興趣與能力::喜歡的事與目前擅長的事不一定完全相同，能力也能透過學習改變。
價值澄清::辨認自己在決策中重視什麼，例如合作、創作或穩定，再看選項是否符合。
資訊訪談::事前準備具體問題，訪談後核對與整理；單一受訪者經驗不等於整個職業。
選項比較::用相同條件比較各方案的需求、代價與可能成果，不只看名稱或印象。`,['一位從業者說工作很辛苦，能直接推論所有相關工作都不適合自己嗎？','不能，需結合其他資訊與自身條件','可以，一個人代表全部','可以，辛苦表示毫無價值','不用蒐集任何其他資訊','訪談提供一種經驗，仍須比較不同情境與自己的需求。']);
add('integrated',8,2,'服務、決策與資源',`
需求評估::先了解被服務者真正的需要，再設計活動，而不是只做自己想做的事。
服務反思::檢視行動的效果、遇到的問題與自己的學習，讓服務經驗轉成可改進的理解。
資源盤點::整理可用人力、時間、工具與經費，確認缺口，再決定可行方案。
決策步驟::釐清問題、蒐集資訊、比較方案、執行並回顧，決策不只是在選項上打勾。
衝突協商::找出各方需求與共同目標，討論可接受的作法，不只爭誰的聲音大。`,['服務活動前，最應先做什麼？','了解服務對象的實際需求','只挑拍照最漂亮的事','先假設對方想要什麼','只計算能拿多少時數','服務計畫應以真實需求為起點，才能檢查是否產生幫助。']);
add('integrated',9,1,'轉銜與自主學習',`
升學資訊查核::確認資料學年度、招生對象與官方來源；歷年規則不一定適用今年。
自主學習::設定問題、選擇資源、實行與檢查理解，而不只是沒有人提醒地坐在書桌前。
學習監控::用實際作答或說明概念檢查會不會，不只計算讀了幾頁。
備案思考::預先考慮條件變動時的替代方式，降低單一計畫失效後無從調整的風險。
經驗整理::把做過的事轉成具體行動、成果與反思，比空泛說自己很努力更有內容。`,['要確認是否真的懂一個公式，哪種做法最直接？','不用看筆記解一題並說明每一步','只看過一次就打勾','只數筆記頁數','抄得越漂亮就視為懂','實際提取與應用能暴露理解缺口，閱讀時間本身不能保證掌握。']);
add('integrated',9,2,'專題整合與生活實踐',`
專題管理::把目標、分工、期限與成果要求連成可執行計畫，過程中追蹤偏差。
成果溝通::依聽眾需求呈現問題、方法與結果，讓別人知道做了什麼與證據在哪。
限制說明::成果報告要指出樣本、資源或方法的限制，不把未驗證部分說成已完成。
回饋修正::把收到的意見轉成可檢查的修改項目，再看修正是否解決原問題。
持續實踐::把學習所得轉為可維持的日常行動，並按環境改變定期調整。`,['專題只訪問5位同學，報告應如何描述結果？','說明這5人的結果及樣本限制','宣稱全校每個人都相同','把沒有訪問的人也列入','刪掉所有方法說明','成果與推論範圍應相符，小樣本不能直接代表全校所有人。']);
add('technology',7,1,'運算思維與設計入門',`
演算法::把解決問題的方法寫成明確且可執行的步驟，順序與條件都要清楚。
輸入處理輸出::系統接收資料，依規則處理，再產生結果；先分清楚每個部分的角色。
流程圖::用圖形與箭頭表示流程，判斷分支要標清條件，避免只有圖卻沒有可執行順序。
工程需求::先說明使用者的問題與期待功能，不把選用某種工具誤當問題本身。
工具安全::依指導正確使用器材並注意防護，不為速度而跳過安全步驟。`,['「把成績輸入程式，程式算平均，再顯示結果」，計算平均屬於？','處理','輸入','輸出','未連線就不存在','成績是輸入，平均計算是處理，顯示平均是輸出。']);
add('technology',7,2,'程式控制與材料',`
循序執行::指令依安排的先後順序執行，前一步結果可能影響後一步。
條件判斷::依條件真假選擇不同流程，需想清楚邊界值與未符合條件時如何處理。

function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){canSave=false;warn('進度暫時無法寫入瀏覽器；目前作答仍保留於本頁，請先匯出備份。');}}
function toast(s){const n=document.querySelector('#toast');n.textContent=s;n.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('visible'),3500);}
function setFont(){document.documentElement.style.fontSize=(16+2*state.font)+'px';}
function subject(id){return D.subjects.find(s=>s.id===id)?.name||id;}
function label(u){return u.grade+'年級'+(u.term===1?'上':'下')+'學期複習分組';}
function route(){const [p,q='']=(location.hash.slice(1)||'/library').split('?');return{parts:p.split('/').filter(Boolean),params:new URLSearchParams(q)};}
function go(hash){if(location.hash===hash)render();else location.hash=hash;}
function seed(){const b=new Uint32Array(1);try{crypto.getRandomValues(b);return b[0];}catch(_){return Date.now()>>>0;}}
function options(items,current){return items.map(([value,text])=>`<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(text)}</option>`).join('');}
function gradeOptions(value){return options([['','全部年級'],['7','七年級'],['8','八年級'],['9','九年級']],value);}
function termOptions(value){return options([['','全年'],['1','上學期分組'],['2','下學期分組']],value);}
function subjectOptions(value){return options([['','全部科目'],...D.subjects.map(s=>[s.id,s.name])],value);}
function scopeNote(){return `<div class="scope">${esc(D.scope)}<br><a href="#/versions">查看學校版本與待補範圍</a></div>`;}
function resources(u){return `<div class="source-links"><p>延伸查核資源（非指定版本課本）：</p>${(D.resources[u.subject]||[]).map(([t,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join('')}</div>`;}
function unitCard(u){return `<article class="card"><div><span class="badge">${esc(subject(u.subject))}</span><span class="badge gray">${esc(label(u))}</span>${state.read.includes(u.id)?'<span class="badge">已讀</span>':''}</div><h3>${esc(u.title)}</h3><p>${u.points.map(p=>esc(p.name)).join(' · ')}</p><div class="actions"><a class="btn primary" href="#/topic/${u.id}">讀重點</a><a class="btn" href="#/practice?unit=${u.id}">練習</a></div></article>`;}
function filtered(){const q=filter.q.normalize('NFKC').toLowerCase().trim();return E.eligible(D,filter).filter(u=>!q||JSON.stringify([u.title,...u.points]).normalize('NFKC').toLowerCase().includes(q));}
function updateCards(){const a=filtered(),n=document.querySelector('#catalog');if(!n)return;document.querySelector('#result-count').textContent=`符合條件 ${a.length} 個主題群`;n.innerHTML=a.length?a.map(unitCard).join(''):'<div class="empty">沒有符合的主題。可清除搜尋或調整年級、學期、科目。</div>';}
function library(){return `<section class="hero"><div class="eyebrow">READ · PRACTISE · UNDERSTAND</div><h1>把觀念讀懂，<br>再用練習確認。</h1><p>七至九年級的核心主題分開整理。先讀重點，再做原創情境與觀念辨識；數學及部分自然主題另外提供可重現的參數變化題。</p><div class="actions"><a class="btn primary" href="#/practice">開始自我檢測</a><a class="btn" href="#/review">查看錯題與收藏</a>${state.session&&!state.session.submitted?'<a class="btn" href="#/quiz">繼續未完成測驗</a>':''}</div>${scopeNote()}</section><div class="stats"><div class="stat"><b>54</b><span>核心主題群</span></div><div class="stat"><b>270</b><span>重點卡＋觀念辨識題</span></div><div class="stat"><b>54</b><span>原創情境題</span></div><div class="stat"><b>16</b><span>參數變化題型</span></div></div><h2>選一個主題開始</h2><div class="filters"><label>年級<select id="filter-grade">${gradeOptions(filter.grade)}</select></label><label>複習分組<select id="filter-term">${termOptions(filter.term)}</select></label><label>科目<select id="filter-subject">${subjectOptions(filter.subject)}</select></label><label>搜尋重點<input id="filter-q" placeholder="例如：光合作用、被動、相似" value="${esc(filter.q)}" maxlength="100"></label></div><div class="result-line"><span id="result-count"></span><button class="btn" data-action="clear-filters">清除條件</button></div><section id="catalog" class="cards" aria-live="polite"></section><section class="panel"><span class="eyebrow">保留原本的詳細教材</span><h2>生物 3-3、4-2 圖解完整版</h2><p>原本的圖解、實驗判讀與逐題解析保留在詳細版；舊版進度仍使用原本的儲存鍵，不會被新版覆蓋。</p><div class="actions"><a class="btn" href="biology-v101.html#/unit/bio-3-3/notes">3-3 植物如何製造養分</a><a class="btn" href="biology-v101.html#/unit/bio-4-2/notes">4-2 植物體內物質的運輸</a></div></section>`;}
function pointCard(u,p,i){const id=u.id+'/'+p.id,on=state.stars.includes(id);return `<article class="point"><div class="point-top"><span class="badge">重點 ${i+1}</span><button class="star ${on?'on':''}" data-star="${id}" aria-pressed="${on}" aria-label="${on?'移除':'收藏'}${esc(p.name)}">${on?'★':'☆'}</button></div><h3>${esc(p.name)}</h3><p>${esc(p.body)}</p></article>`;}
function topic(id){const u=D.units.find(u=>u.id===id);if(!u)return '<div class="empty"><h1>找不到這個主題</h1><a href="#/library">回學習目錄</a></div>';const read=state.read.includes(id);return `<a class="back" href="#/library">← 回學習目錄</a><section class="hero"><span class="badge">${esc(subject(u.subject))}</span><span class="badge gray">${esc(label(u))}</span><h1>${esc(u.title)}</h1><p>下面先整理五個核心觀念。這不是整冊課本摘要；正式版本、章名與順序仍需對照校方當年度教材。</p><div class="actions"><a class="btn primary" href="#/practice?unit=${u.id}">練習這個主題</a><button class="btn" data-read="${u.id}" aria-pressed="${read}">${read?'✓ 已讀，可取消':'標記已讀'}</button><button class="btn" data-action="print">列印本主題</button></div></section><div class="grid-two">${u.points.map((p,i)=>pointCard(u,p,i)).join('')}</div><section class="panel"><span class="eyebrow">想一想 · 原創情境</span><h2 class="stem">${esc(u.scene.stem)}</h2><p>${u.scene.options.map((x,i)=>String.fromCharCode(65+i)+'. '+esc(x)).join('<br>')}</p><details class="no-print"><summary>看參考答案與思路</summary><div class="explain"><strong>A. ${esc(u.scene.options[0])}</strong><p>${esc(u.scene.explanation)}</p></div></details><div class="print-only explain"><strong>答案：A</strong><p>${esc(u.scene.explanation)}</p></div><label class="checkline no-print"><input type="checkbox" id="print-answers"> 列印時附上情境題答案</label></section><section class="panel quick-list"><h2>考前三分鐘</h2>${u.points.map(p=>`<p><strong>${esc(p.name)}</strong>：${esc(p.body.split('；')[0])}</p>`).join('')}${resources(u)}</section>`;}
function selectedPractice(){const r=route(),u=D.units.find(x=>x.id===r.params.get('unit'));return{unit:u?.id||'',grade:u?String(u.grade):r.params.get('grade')||'',term:u?String(u.term):r.params.get('term')||'',subject:u?.subject||r.params.get('subject')||'',seed:r.params.get('seed')||'',count:r.params.get('count')||'10',mode:r.params.get('mode')||'normal'};}
function practice(){const p=selectedPractice(),available=E.eligible(D,p);return `<section class="hero"><div class="eyebrow">PRACTICE LAB</div><h1>每一份題目，都能回頭檢查。</h1><p>選範圍、題數與模式。單一非計算主題有6道不重複題目；不足所選題數時按實際題量出卷，不用重複題湊數。</p></section><form id="practice-form" class="panel"><div class="form-grid"><label>年級<select name="grade" id="practice-grade">${gradeOptions(p.grade)}</select></label><label>複習分組<select name="term" id="practice-term">${termOptions(p.term)}</select></label><label>科目<select name="subject" id="practice-subject">${subjectOptions(p.subject)}</select></label><label class="wide">主題<select name="unit" id="practice-unit">${options([['','範圍內所有主題'],...available.map(u=>[u.id,subject(u.subject)+'｜'+label(u)+'｜'+u.title])],p.unit)}</select></label><label>題數<select name="count">${options([['5','5題'],['10','10題'],['20','20題']],p.count)}</select></label><label>模式<select name="mode">${options([['normal','均衡隨機'],['weak','優先加強錯誤較多的題型']],p.mode)}</select></label><label>出題種子（可留白）<input name="seed" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="相同設定可重現試卷" value="${esc(p.seed)}"></label></div><div class="actions"><button class="btn primary" type="submit">產生測驗</button>${state.session?'<a class="btn" href="#/quiz">查看上次試卷</a>':''}</div><p class="small muted">「換題」的意思：固定題庫抽題與選項洗牌；16類參數題另外改變數值並重新計算答案。不是每次連線呼叫AI，也不把排列組合宣稱成無限新知識點。</p></form>`;}
function refreshPracticeUnits(){const f=document.querySelector('#practice-form');const p={grade:f.elements.grade.value,term:f.elements.term.value,subject:f.elements.subject.value};f.elements.unit.innerHTML=options([['','範圍內所有主題'],...E.eligible(D,p).map(u=>[u.id,subject(u.subject)+'｜'+label(u)+'｜'+u.title])],'');}
function begin(qs,settings,kind='normal'){if(!qs.length){toast('這個範圍沒有可用題目，請調整條件。');return;}if(state.session&&!state.session.submitted&&state.session.picks.some(p=>p!==null)&&!confirm('將開始新試卷；目前未交卷的作答會被取代。要繼續嗎？'))return;state.session={...settings,kind,questions:qs,picks:qs.map(()=>null),index:0,submitted:false};save();go('#/quiz');}
function paperTitle(s){return s.kind==='retry'?'錯題／未答重做':s.unit?(D.units.find(u=>u.id===s.unit)?.title||'主題測驗'):'範圍綜合測驗';}
function quiz(){const s=state.session;if(!s)return '<section class="empty"><h1>還沒有試卷</h1><a class="btn primary" href="#/practice">設定測驗範圍</a></section>';if(s.submitted)return results(s);const i=s.index||0,q=s.questions[i],u=D.units.find(u=>u.id===q.unit),answered=s.picks.filter(p=>p!==null).length;return `<a class="back" href="#/practice">← 測驗設定（目前試卷會保留）</a><section class="panel"><div class="quiz-head"><div><span class="eyebrow">${esc(paperTitle(s))}</span><h1>第 ${i+1} / ${s.questions.length} 題</h1></div><span class="badge">已答 ${answered} 題</span></div><div class="progress"><i style="width:${answered/s.questions.length*100}%"></i></div><span class="badge">${esc(subject(u.subject))}</span><span class="badge gray">${esc(q.type)}</span><h2 class="stem" id="question-stem" tabindex="-1">${esc(q.stem)}</h2><div class="options" role="group" aria-labelledby="question-stem">${q.options.map((o,j)=>`<button class="option ${s.picks[i]===j?'selected':''}" data-pick="${j}" aria-pressed="${s.picks[i]===j}"><b>${String.fromCharCode(65+j)}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><button class="btn" data-action="prev" ${i===0?'disabled':''}>上一題</button>${i<s.questions.length-1?'<button class="btn primary" data-action="next">下一題</button>':'<button class="btn primary" data-action="submit">交卷看解析</button>'}<button class="btn" data-action="submit">交卷</button></div><div class="answer-map" aria-label="跳到指定題目">${s.questions.map((_,j)=>`<button aria-label="跳到第${j+1}題" class="${s.picks[j]!==null?'filled':''} ${i===j?'current':''}" data-jump="${j}">${j+1}</button>`).join('')}</div><p class="step-line">作答後可前後檢查；重新整理也保留同一份試卷與選項順序。種子：${esc(s.seed??'原題重做')}</p></section>`;}
function resultRow(q,p,i){const ok=p===q.answer,unanswered=p===null,u=D.units.find(u=>u.id===q.unit);return `<article class="review-row"><span class="badge ${ok?'':'pending'}">${unanswered?'未作答':ok?'答對':'待訂正'}</span><span class="badge gray">${esc(q.type)}</span><h3>${i+1}. ${esc(q.stem)}</h3><p>你的答案：${unanswered?'未作答':String.fromCharCode(65+p)+'. '+esc(q.options[p])}<br><strong>正確答案：${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong></p><div class="explain ${ok?'':'wrong'}">${esc(q.explanation)}</div><p><a href="#/topic/${q.unit}">回到「${esc(u.title)}」複習 →</a></p></article>`;}
function results(s){const n=E.grade(s.questions,s.picks);return `<section class="hero"><div class="eyebrow">REVIEW & LEARN</div><h1>這次掌握了哪些觀念？</h1><p class="score">${n.correct} / ${n.total}</p><p>答錯 ${n.wrong} 題 · 未作答 ${n.unanswered} 題。這是本次題目結果，不代表完整學科能力等級。</p><div class="actions"><button class="btn primary" data-action="retry-session" ${!n.wrong&&!n.unanswered?'disabled':''}>只重做錯題與未答</button><button class="btn" data-action="new-paper">同範圍換一份</button><a class="btn" href="#/review">查看累積錯題</a><button class="btn" data-action="share-settings">複製出題設定</button></div></section><div id="share-fallback"></div><h2>逐題解析</h2>${s.questions.map((q,i)=>resultRow(q,s.picks[i],i)).join('')}`;}
function review(){const wrong=Object.values(state.wrong),points=D.units.flatMap(u=>u.points.filter(p=>state.stars.includes(u.id+'/'+p.id)).map(p=>({u,p}))),attempts=Object.values(state.stats).reduce((n,s)=>n+s.attempts,0);return `<section class="hero"><div class="eyebrow">MY REVIEW</div><h1>把錯題變成下次會的題。</h1><p>目前有 ${wrong.length} 個待訂正題型、${points.length} 張收藏重點卡，累計 ${attempts} 次已交卷作答。同題型答對後會從待訂正清單移除，累積錯誤次數仍保留。</p><div class="actions"><button class="btn primary" data-action="retry-all" ${wrong.length?'':'disabled'}>重做待訂正題型</button><a class="btn" href="#/practice?mode=weak">加強弱點出題</a></div></section><h2>待訂正</h2>${wrong.length?wrong.map((x,i)=>`<article class="review-row"><span class="badge pending">累計錯誤 ${state.stats[x.question.template]?.errors||0} 次</span><h3>${i+1}. ${esc(x.question.stem)}</h3><div class="actions"><button class="btn" data-retry="${esc(x.question.template)}">只練這一題</button><a class="btn" href="#/topic/${x.question.unit}">回看重點</a></div></article>`).join(''):'<div class="empty">目前沒有待訂正題型。可以先完成一份測驗。</div>'}<h2 style="margin:28px 0 16px">收藏重點</h2><div class="grid-two">${points.map(({u,p},i)=>pointCard(u,p,i)).join('')||'<div class="empty">閱讀主題時按☆，可加入這裡。</div>'}</div>`;}
function versions(){return `<section class="hero"><span class="eyebrow">CONTENT STATUS</span><h1>永和國中115教材版本查核</h1><p>不將舊學年度、其他學校或未核實的資料列成已確認。</p>${scopeNote()}</section><section class="panel"><h2>目前查核狀態：待取得完整官方表</h2><p>${esc(D.school.note)}</p><p class="small muted">查核日期：${D.school.checked}。即使確認各年級出版社，也不代表已取得同出版社當年度每冊的完整章節目錄。</p><div class="actions"><a class="btn" href="${D.school.url}" target="_blank" rel="noopener noreferrer">開啟校方教科書公告</a><a class="btn" href="https://www.jhjhs.ntpc.edu.tw/p/405-1000-15182%2Cc178.php" target="_blank" rel="noopener noreferrer">113歷史公告（不可代替115）</a></div><div class="table-wrap"><table><thead><tr><th>領域</th><th>七年級</th><th>八年級</th><th>九年級</th></tr></thead><tbody>${D.subjects.map(s=>`<tr><th>${esc(s.name)}</th><td>待核對</td><td>待核對</td><td>待核對</td></tr>`).join('')}</tbody></table></div><h2>已完成與待補範圍</h2><p><strong>已完成：</strong>九領域的54個核心主題群、270張重點卡、54題情境題、270題概念辨識，以及16類計算變化題。原生物3-3與4-2詳細版保留。</p><p><strong>尚未完成：</strong>115正式版本與逐課對照、所有課本章節、本土語文實際選修語別與教材、校訂課程及教師指定範圍。不能把54個主題群等同三年全部課程。</p></section>`;}
function backup(){return `<section class="hero"><h1>備份、還原與使用說明</h1><p>本版資料存在這個瀏覽器，不會自動跨手機與電腦同步；本功能不需要輸入孩子姓名、班級或成績。</p></section><section class="panel"><h2>學習紀錄</h2><p>匯出包含已讀、收藏、作答中的試卷、錯題快照與題型統計。還原前會檢查題目及答案是否符合本版教材，無效資料不會覆蓋現有進度。</p><div class="actions"><button class="btn primary" data-action="export">匯出備份</button><label class="btn" for="backup-file">選擇備份還原</label><input id="backup-file" type="file" accept="application/json,.json" hidden></div>${!canSave&&originalRaw?'<p><button class="btn" data-action="export-original">匯出尚未覆寫的原資料</button></p>':''}<p class="small muted">備份上限1MB。還原會取代本版紀錄，不會改動舊生物版儲存鍵。舊生物版請到其「使用與備份」另行匯出。</p></section><section class="panel"><h2>怎麼使用比較有效？</h2><p>先讀一個主題，用自己的話說明核心概念，再作答檢查。遇到錯題先看解析與原重點，之後再重新測一次，不只記住答案位置。</p><p>「均衡隨機」從範圍中抽題；「加強弱點」提高曾答錯題型被抽到的權重，仍保留其他題型。種子相同且設定、題庫版本相同，可重現一般模式；弱點模式另受當時學習紀錄影響。</p><p>目前是跨版本核心學習站，不能取代當年度課本、老師公告或正式考試成績。備份檔內的作答紀錄只供本人使用，不上傳至GitHub。</p></section>`;}
function render(){const r=route(),v=r.parts[0]||'library';if(v==='unit'&&['bio-3-3','bio-4-2'].includes(r.parts[1])){location.replace('biology-v101.html'+location.hash);return;}document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#/'+v||(v==='home'&&a.hash==='#/library')));main.innerHTML=v==='topic'?topic(r.parts[1]):v==='practice'&&r.parts[1]==='versions'?versions():v==='practice'?practice():v==='quiz'?quiz():v==='review'?review():v==='versions'?versions():v==='backup'?backup():library();if(document.querySelector('#catalog'))updateCards();document.body.classList.add('hide-print-answer');document.title='知識小站 V1.2｜'+({practice:'自我檢測',quiz:'作答與解析',review:'我的複習',versions:'版本查核',backup:'備份'}[v]||'國中核心學習');}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function newPaper(s){const settings={unit:s.unit||'',grade:s.grade||'',term:s.term||'',subject:s.subject||'',count:s.count||s.questions.length,mode:s.mode||'normal',seed:seed()};begin(E.paper(D,{...settings,stats:state.stats,wrong:state.wrong}),settings);}
document.addEventListener('submit',e=>{if(e.target.id!=='practice-form')return;e.preventDefault();const f=e.target,raw=f.elements.seed.value;const n=raw===''?seed():Number(raw);if(!Number.isInteger(n)||n<0||n>4294967295){toast('種子請填0到4294967295的整數。');return;}const settings={grade:f.elements.grade.value,term:f.elements.term.value,subject:f.elements.subject.value,unit:f.elements.unit.value,count:Number(f.elements.count.value),mode:f.elements.mode.value,seed:n};begin(E.paper(D,{...settings,stats:state.stats,wrong:state.wrong}),settings);});
document.addEventListener('click',async e=>{
 const star=e.target.closest('[data-star]');if(star){const id=star.dataset.star;state.stars=state.stars.includes(id)?state.stars.filter(x=>x!==id):[...state.stars,id];save();const y=scrollY;render();scrollTo(0,y);return;}
 const read=e.target.closest('[data-read]');if(read){const id=read.dataset.read;state.read=state.read.includes(id)?state.read.filter(x=>x!==id):[...state.read,id];save();const y=scrollY;render();scrollTo(0,y);return;}
 const pick=e.target.closest('[data-pick]');if(pick&&state.session&&!state.session.submitted){const i=state.session.index||0;state.session.picks[i]=Number(pick.dataset.pick);save();const y=scrollY;render();scrollTo(0,y);return;}
 const jump=e.target.closest('[data-jump]');if(jump&&state.session&&!state.session.submitted){state.session.index=Number(jump.dataset.jump);save();render();main.focus();return;}
 const retry=e.target.closest('[data-retry]');if(retry){const item=state.wrong[retry.dataset.retry];if(item)begin([item.question],{unit:item.question.unit,seed:item.question.seed,count:1},'retry');return;}
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,s=state.session;
 if(action==='clear-filters'){filter={grade:'',term:'',subject:'',q:''};render();}
 if(action==='print')window.print();
 if((action==='next'||action==='prev')&&s&&!s.submitted){s.index=Math.max(0,Math.min(s.questions.length-1,(s.index||0)+(action==='next'?1:-1)));save();render();document.querySelector('#question-stem')?.focus();}
 if(action==='submit'&&s&&!s.submitted){const unanswered=s.picks.filter(x=>x===null).length;if(unanswered&&!confirm('還有'+unanswered+'題未作答，仍要交卷嗎？'))return;state=E.record(state,s.questions,s.picks);state.session.submitted=true;save();render();scrollTo(0,0);}
 if(action==='retry-session'&&s){const qs=s.questions.filter((q,i)=>s.picks[i]!==q.answer);begin(qs,{unit:s.unit||'',grade:s.grade||'',term:s.term||'',subject:s.subject||'',seed:s.seed,count:qs.length},'retry');}
 if(action==='retry-all'){const qs=Object.values(state.wrong).slice(0,50).map(x=>x.question);begin(qs,{seed:0,count:qs.length},'retry');}
 if(action==='new-paper'&&s)newPaper(s);
 if(action==='export')download(JSON.stringify(state,null,2),'知識小站-v12-學習備份.json');
 if(action==='export-original')download(originalRaw,'知識小站-原始儲存資料.json');
 if(action==='share-settings'&&s){if(s.kind==='retry'){toast('錯題重做以原題快照為準；請用備份保留這份試卷。');return;}const p=new URLSearchParams();for(const k of ['unit','grade','term','subject','count','seed','mode'])if(s[k]!==undefined&&s[k]!=='')p.set(k,s[k]);const link=location.href.split('#')[0]+'#/practice?'+p;try{await navigator.clipboard.writeText(link);toast('已複製設定；弱點模式另受當時紀錄影響。');}catch(_){const n=document.querySelector('#share-fallback');n.innerHTML='<label>可複製這個連結<input readonly id="share-link"></label>';n.querySelector('input').value=link;n.querySelector('input').select();}}
});
document.addEventListener('input',e=>{if(e.target.id==='filter-q'){filter.q=e.target.value;updateCards();}});
document.addEventListener('change',async e=>{
 if(e.target.id.startsWith('filter-')&&e.target.id!=='filter-q'){filter[e.target.id.replace('filter-','')]=e.target.value;updateCards();}
 if(['practice-grade','practice-term','practice-subject'].includes(e.target.id))refreshPracticeUnits();
 if(e.target.id==='print-answers')document.body.classList.toggle('hide-print-answer',!e.target.checked);
 if(e.target.id==='backup-file'){const file=e.target.files[0];try{if(!file)return;if(file.size>1000000)throw Error('備份超過1MB，尚未變更進度。');const next=E.validateState(JSON.parse(await file.text()),D);if(!confirm('這將取代本版學習進度，確定還原？'))return;state=next;canSave=true;save();setFont();render();toast('備份已還原。');}catch(err){toast(err instanceof SyntaxError?'檔案不是有效JSON；原進度未變更。':err.message);}finally{e.target.value='';}}
});
document.querySelector('#font').addEventListener('click',()=>{state.font=(state.font+1)%3;setFont();save();toast('字級已調整。');});
window.addEventListener('hashchange',()=>{render();scrollTo(0,0);});
window.JHApp={getState:()=>JSON.parse(JSON.stringify(state)),version:D.version};
setFont();render();
})();

</script></head>
