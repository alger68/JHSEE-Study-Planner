    return {...state, [key]:items.includes(id) ? items.filter(x=>x!==id) : [...items,id]};
  }
  function score(unit, answers) {
    const out = {total:unit.quiz.length, answered:0, correct:0, wrong:[]};
    unit.quiz.forEach(q => {
      const selected = answers[`${unit.id}/${q.id}`];
      if (!q.options.some(o=>o.id===selected)) return;
      out.answered++;
      if (selected===q.answer) out.correct++; else out.wrong.push(q.id);
    });
    return out;
  }
  const normalize = value => String(value ?? '').normalize('NFKC').toLowerCase().trim();
  function search(data, query) {
    const tokens = normalize(query).split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];
    const hits = [];
    data.units.filter(u=>u.status==='published').forEach(u=>{
      const matches = value => tokens.every(t=>normalize(value).includes(t));
      const head = [u.title,u.chapter,u.publisher,u.summary,...u.tags].join(' ');
      let found = false;
      u.concepts.forEach(c=>{
        if(matches([head,c.title,c.lead,...c.body].join(' '))) {
          hits.push({unit:u.id,concept:c.id,title:c.title,snippet:c.lead,chapter:u.chapter}); found=true;
        }
      });
      if(!found && matches(JSON.stringify(u))) hits.push({unit:u.id,concept:null,title:u.title,snippet:u.summary,chapter:u.chapter});
    });
    return hits;
  }
  function validateData(data) {
    const errors=[];
    if (!object(data) || !Array.isArray(data.units) || !Array.isArray(data.sources) || !Array.isArray(data.subjects)) return ['資料必須包含 units、sources、subjects'];
    const sourceIds=new Set(), unitIds=new Set(), subjectIds=new Set();
    data.subjects.forEach(s=>{if(!object(s)||!ID.test(s.id)||!text(s.name)||subjectIds.has(s.id))errors.push('subject invalid');else subjectIds.add(s.id);});
    data.sources.forEach(s=>{if(!object(s)){errors.push('source invalid');return;}if(!text(s.id)||sourceIds.has(s.id)||!safeURL(s.url)||!text(s.title)) errors.push(`source invalid: ${s.id}`);sourceIds.add(s.id);});
    const checkRefs=(refs,at)=>{
      if(!Array.isArray(refs)||!refs.length) errors.push(`source missing: ${at}`);
      else refs.forEach(s=>{if(!sourceIds.has(s)) errors.push(`source unknown: ${at}/${s}`);});
    };
    data.units.forEach(u=>{
      if(!object(u)){errors.push('unit invalid');return;}
      if(!Array.isArray(u.tags)||!u.tags.every(text))errors.push(`tags invalid: ${u.id}`);
      if(!ID.test(u.id)||unitIds.has(u.id)) errors.push(`duplicate or invalid unit: ${u.id}`);unitIds.add(u.id);
      if(!subjectIds.has(u.subject)) errors.push(`subject unknown: ${u.id}`);
      ['title','chapter','publisher','summary'].forEach(k=>{if(!text(u[k])) errors.push(`${u.id} missing ${k}`);});
      if(![7,8,9].includes(u.grade)||![1,2].includes(u.semester)) errors.push(`grade/semester invalid: ${u.id}`);
      if(!['draft','published'].includes(u.status)) errors.push(`status invalid: ${u.id}`);
      if(!Array.isArray(u.concepts)||!u.concepts.length||!Array.isArray(u.quiz)||!u.quiz.length) {errors.push(`empty concepts/quiz: ${u.id}`);return;}
      const cids=new Set(), qids=new Set();
      u.concepts.forEach(c=>{
        if(!object(c)){errors.push('concept invalid');return;}
        if(!ID.test(c.id)||cids.has(c.id)) errors.push(`duplicate concept: ${u.id}/${c.id}`);cids.add(c.id);
        if(!text(c.title)||!text(c.lead)||!Array.isArray(c.body)||!c.body.every(text)) errors.push(`concept text invalid: ${u.id}/${c.id}`);
        checkRefs(c.sources,`${u.id}/${c.id}`);
      });
      u.quiz.forEach(q=>{
        if(!object(q)){errors.push('question invalid');return;}
        if(!ID.test(q.id)||qids.has(q.id)) errors.push(`duplicate question: ${u.id}/${q.id}`);qids.add(q.id);
        if(!cids.has(q.concept)||!text(q.question)) errors.push(`question invalid: ${u.id}/${q.id}`);
        if(!Array.isArray(q.options)||q.options.length<2) {errors.push(`options missing: ${q.id}`);return;}
        const opts=new Set();
        q.options.forEach(o=>{if(!object(o)){errors.push(`option invalid: ${q.id}`);return;}if(!ID.test(o.id)||opts.has(o.id)||!text(o.text)||!text(o.explanation)) errors.push(`option invalid: ${q.id}`);opts.add(o.id);});
        if(!opts.has(q.answer)) errors.push(`answer invalid: ${u.id}/${q.id}`);
        checkRefs(q.sources,`${u.id}/${q.id}`);
      });
      ['diagrams','tables','traps','experiments'].forEach(k=>{
        if(!Array.isArray(u[k])) errors.push(`array missing: ${u.id}/${k}`);
        else u[k].forEach((x,i)=>{
          if(!object(x)){errors.push(`block invalid: ${u.id}/${k}/${i}`);return;}
          const at=`${u.id}/${k}/${i}`;
          checkRefs(x.sources,at);
          const pair=value=>Array.isArray(value)&&value.length===2&&value.every(text);
          const pairs=value=>Array.isArray(value)&&value.length>0&&value.every(pair);
          const texts=value=>Array.isArray(value)&&value.every(text);
          if(k==='diagrams') {
            if(!text(x.title)||!text(x.note))errors.push(`diagram text invalid: ${at}`);
            const valid={equation:()=>texts(x.conditions)&&pairs(x.inputs)&&pairs(x.outputs),
              layers:()=>pairs(x.items),flow:()=>pairs(x.items),
              branches:()=>pair(x.center)&&pairs(x.branches)&&text(x.label)};
            if(!Object.hasOwn(valid,x.kind)||!valid[x.kind]())errors.push(`diagram shape invalid: ${at}`);
          }
          if(k==='tables'&&(!text(x.title)||!texts(x.headers)||!x.headers.length||!Array.isArray(x.rows)||!x.rows.every(r=>texts(r)&&r.length===x.headers.length)))errors.push(`table invalid: ${at}`);
          if(k==='traps'&&!['wrong','right','why'].every(key=>text(x[key])))errors.push(`trap invalid: ${at}`);
          if(k==='experiments'&&(!['title','question','result','conclusion','warning'].every(key=>text(x[key]))||!texts(x.steps)||!x.steps.length))errors.push(`experiment invalid: ${at}`);
        });
      });
      if(!Array.isArray(u.quick)||!u.quick.every(text)) errors.push(`quick invalid: ${u.id}`);
    });
    return errors;
  }
  function validateBackup(input, data) {
    const fail=()=>{throw new Error('備份格式或教材版本不符；原有進度未變更。');};
    if(!object(input)||input.app!==APP||input.schemaVersion!==1) fail();
    if(!Array.isArray(input.read)||!Array.isArray(input.starred)||!object(input.answers)||![0,1,2].includes(input.font)) fail();
    const unitIds=new Set(data.units.map(u=>u.id));
    const conceptIds=new Set(data.units.flatMap(u=>u.concepts.map(c=>`${u.id}/${c.id}`)));
    const questions=new Map(data.units.flatMap(u=>u.quiz.map(q=>[`${u.id}/${q.id}`,q])));
    if(input.read.some(x=>!unitIds.has(x))||input.starred.some(x=>!conceptIds.has(x))) fail();
    const answers={};
    for(const [key, value] of Object.entries(input.answers)) {
      const q=questions.get(key);
      if(!q||!q.options.some(o=>o.id===value)) fail();
      answers[key]=value;
    }
    return {app:APP,schemaVersion:1,read:[...new Set(input.read)],starred:[...new Set(input.starred)],answers,font:input.font};
  }
  return {APP,defaultState,toggle,score,search,validateData,validateBackup,escapeHTML,safeURL};
});

tagline":"一束光，一片葉，一份養分。","tags":["光合作用","葉片構造","實驗判讀"],"tone":"green","minutes":12,"version":"1.0.1","updated":"2026-09-24","status":"published","reviewNote":"原有生物專題；出版社已依115官方表核對。課文頁碼與教師範圍仍須對照實際課本。","concepts":[{"id":"purpose","title":"光合作用，重點是製造養分","lead":"主要功能：製造葡萄糖等有機養分，不是只為了產生氧氣。","body":["植物利用光能，把簡單的原料製成可利用的有機物；能量儲存在有機物中。","氧氣是過程中的產物。考題問「主要目的」時，要選製造養分。"],"sources":["photo","photo-review"],"example":"想像葉片是一間用光能工作的工廠：要製造的產品是養分。"},{"id":"ingredients","title":"原料、條件、產物要分開","lead":"原料是二氧化碳和水；光提供能量，葉綠素吸收光能。","body":["國中簡化式：二氧化碳＋水 → 葡萄糖＋氧氣；箭頭上標示光及葉綠素。","二氧化碳供應糖中的碳；光合作用釋出的氧氣來自水，而不是把二氧化碳直接拆成氧氣。"],"sources":["photo","pigment","photo-review"]},{"id":"chloroplasts","title":"葉綠體不是葉綠素","lead":"葉綠體是細胞內的構造；葉綠素是其中能吸收光能的色素。","body":["常見綠色植物的光合作用在葉綠體內進行。不是所有植物細胞都有葉綠體，例如根部多數細胞沒有。","紅色或紫色的葉片可能也有葉綠素，只是被其他色素掩蓋；不能只憑外表顏色判斷。"],"sources":["chloroplast","pigment","photo-review"]},{"id":"leaf-structure","title":"葉肉製造，表皮保護，葉脈運送","lead":"葉肉細胞有許多葉綠體，是葉片製造養分的主力。","body":["一般表皮細胞通常沒有葉綠體；但表皮中的保衛細胞具有葉綠體，是常考的例外。","兩個保衛細胞之間的空隙是氣孔。氣孔不是細胞；保衛細胞能調節其開閉。","葉脈內的木質部和韌皮部負責運輸，會在4-2再學到。"],"sources":["leaf","mesophyll","guard","stoma","bundle"]},{"id":"starch","title":"葡萄糖可以轉成澱粉儲存","lead":"碘液檢驗的是澱粉，不是直接檢驗葡萄糖。","body":["葡萄糖可以供細胞使用，也能轉變成澱粉儲存；碘液遇到澱粉會出現藍黑色或深藍色。","直接驗出澱粉，只能證明檢驗時有澱粉。要推論光照的作用，還要先排除原有澱粉並控制其他條件。"],"sources":["iodine","photo","transport"]},{"id":"experiments","title":"實驗題：先找「哪一個條件不同」","lead":"比較照光與遮光，要讓葉片其他條件盡量相同。","body":["先在暗處處理植物，降低原先儲存的澱粉干擾；再讓同一片葉的不同部位照光或遮光。","在適當條件下，照光處驗出澱粉、遮光處沒有，才支持「光是製造養分所需的條件」。","比較綠色與已確認缺乏葉綠素的白色部分，則是在研究葉綠素；不可把「看起來非綠色」一概當成沒有葉綠素。"],"sources":["photo","pigment","iodine"]}],"diagrams":[{"kind":"equation","title":"光合作用，先記住這條路","note":"這是國中簡化的物質關係，不是完整反應機制。光是能量來源，不是質量的來源。","conditions":["光：提供能量","葉綠素：吸收光能"],"inputs":[["CO₂","二氧化碳・原料"],["水","原料"]],"outputs":[["葡萄糖","有機養分"],["O₂","氧氣・產物"]],"sources":["photo","pigment","photo-review"]},{"kind":"layers","title":"從葉片外面，走到裡面","note":"排列是功能示意，非顯微鏡照片，也不按實際比例繪製。","items":[["角質層","減少水分散失"],["上表皮","保護與透光；一般細胞通常無葉綠體"],["葉肉組織","含許多葉綠體；主要光合作用部位"],["葉脈穿行於葉肉中","木質部運水；韌皮部運養分"],["下表皮","具有保護功能"],["保衛細胞 → 氣孔 ← 保衛細胞","有葉綠體的是保衛細胞；中間空隙不是細胞"]],"sources":["leaf","mesophyll","guard","stoma","bundle"]}],"tables":[{"title":"葉片構造，一次分清楚","headers":["構造","葉綠體","主要功能"],"rows":[["一般表皮細胞","通常沒有","保護、讓光線穿透"],["葉肉細胞","多","光合作用"],["保衛細胞","有","調節氣孔開閉"],["氣孔","不是細胞","氣體與水蒸氣進出的通道"],["葉脈","不是判讀重點","運輸水分與養分"]],"note":"「表皮通常沒有葉綠體」指一般表皮細胞，不能把保衛細胞也排除。","sources":["leaf","mesophyll","guard","stoma","bundle"]}],"experiments":[{"title":"光與光合作用","question":"光照是否影響葉片形成澱粉？","steps":["先在暗處處理，排除原有澱粉的干擾。","同一片葉部分遮光、部分照光，其他條件盡量相同。","經教師指導完成脫色、清洗及碘液檢測。"],"result":"條件適當且實驗成功時，照光處呈藍黑色，遮光處不呈藍黑色。","conclusion":"支持光是本實驗中製造養分所需的條件。","warning":"酒精易燃，脫色須由教師指導並採隔水加熱；不可直接用火加熱酒精。","sources":["photo","iodine"]},{"title":"葉綠素與光合作用","question":"綠色與缺乏葉綠素的白色區域有何差異？","steps":["先標記同一片斑葉的綠色和白色部位。","排除原有澱粉後，讓兩部位接受相同光照。","脫色後檢驗澱粉，對照先前的標記判讀。"],"result":"在控制良好的實驗中，綠色部分有澱粉，缺乏葉綠素的白色部分沒有。","conclusion":"支持葉綠素對光合作用的重要性；不同的變因是葉綠素，不是光。","warning":"紅色葉片未必缺乏葉綠素；要依題目提供的實驗條件判斷。","sources":["pigment","chloroplast","iodine"]}],"traps":[{"wrong":"光合作用的主要目的是製造氧氣。","right":"主要功能是製造有機養分。","why":"氧氣是產物，不能把副產物當成這題所問的主要目的。","sources":["photo"]},{"wrong":"分解水會釋放二氧化碳。","right":"光合作用釋出的氧氣來自水。","why":"二氧化碳是合成糖的原料，不是水分解後的氣體。","sources":["photo","photo-review"]},{"wrong":"所有植物細胞都能光合作用。","right":"常見植物中，有葉綠體的細胞才能進行光合作用。","why":"多數根細胞與一般表皮細胞沒有葉綠體；葉肉和保衛細胞則有。","sources":["chloroplast","mesophyll","guard"]},{"wrong":"滴碘液變藍黑色，就直接驗出葡萄糖。","right":"直接驗出的是澱粉。","why":"還需要適當的實驗設計，才可推論光合作用與實驗條件的關係。","sources":["iodine"]},{"wrong":"「光合作用通常在葉綠體中進行」是錯的。","right":"這句在本節常見植物的情境中是正確的。","why":"不要把「不是所有細胞都有葉綠體」誤當成「光合作用不在葉綠體內進行」。","sources":["chloroplast"]}],"quiz":[{"id":"q1","concept":"purpose","question":"植物進行光合作用的主要功能是什麼？","options":[{"id":"oxygen","text":"製造氧氣","explanation":"氧氣是產物，但不是本題所問的主要功能。"},{"id":"food","text":"製造有機養分","explanation":"正確。植物利用光能製造葡萄糖等有機養分。"},{"id":"water","text":"製造水供根吸收","explanation":"水主要由根自土壤吸收，且是光合作用原料之一。"},{"id":"minerals","text":"把光變成無機鹽","explanation":"光提供能量，不會轉變成無機鹽。"}],"answer":"food","sources":["photo"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"基礎","ability":"科學概念與探究","chapterLabel":"第3章 › 3-3 植物如何製造養分"},{"id":"q2","concept":"ingredients","question":"光合作用過程中，釋出的氧氣主要來自哪一種原料？","options":[{"id":"co2","text":"二氧化碳","explanation":"二氧化碳供應形成糖所需的碳，釋放的氧氣並非來自它。"},{"id":"soil","text":"土壤中的沙粒","explanation":"沙粒不是光合作用產生氧氣的來源。"},{"id":"water","text":"水","explanation":"正確。水在光合作用過程中被分解，釋出氧氣。"},{"id":"sugar","text":"澱粉","explanation":"澱粉是植物儲存養分的形式，不是釋氧來源。"}],"answer":"water","sources":["photo","photo-review"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"觀念","ability":"科學概念與探究","chapterLabel":"第3章 › 3-3 植物如何製造養分"},{"id":"q3","concept":"leaf-structure","question":"下列哪一個是「通常具有葉綠體，並調節氣孔開閉」的細胞？","options":[{"id":"guard","text":"保衛細胞","explanation":"正確。保衛細胞有葉綠體，主要功能是調節氣孔開閉。"},{"id":"epidermis","text":"一般表皮細胞","explanation":"一般表皮細胞通常沒有葉綠體。"},{"id":"root","text":"根部多數細胞","explanation":"多數根細胞沒有葉綠體，也不負責氣孔開閉。"},{"id":"pore","text":"氣孔","explanation":"氣孔是兩個保衛細胞間的空隙，不是一個細胞。"}],"answer":"guard","sources":["guard","stoma"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"應用","ability":"科學概念與探究","chapterLabel":"第3章 › 3-3 植物如何製造養分"},{"id":"q4","concept":"experiments","question":"先排除原有澱粉，再讓同一片葉部分遮光、部分照光。照光處加碘液變藍黑色，遮光處沒有。最適當的推論是？","options":[{"id":"oxygen","text":"氧氣是光合作用必要原料","explanation":"這個實驗沒有操縱氧氣，也不能得出此結論。"},{"id":"chlorophyll","text":"遮光處一定沒有葉綠素","explanation":"遮光不等於沒有葉綠素。"},{"id":"all","text":"所有細胞都能光合作用","explanation":"不同處理的同一片葉，不能證明所有植物細胞都有這個能力。"},{"id":"light","text":"光是這個實驗中形成養分所需的條件","explanation":"正確。兩部位主要差別是光照，檢測結果則是澱粉有無。"}],"answer":"light","sources":["photo","iodine"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"易錯","ability":"科學概念與探究","chapterLabel":"第3章 › 3-3 植物如何製造養分"},{"id":"q5","concept":"chloroplasts","question":"下列哪些敘述錯誤？\n甲：光合作用主要為了製造氧氣。\n乙：葡萄糖能轉成澱粉儲存。\n丙：常見植物的光合作用在葉綠體中進行。\n丁：水分解後釋出二氧化碳。\n戊：所有植物細胞都能進行光合作用。","options":[{"id":"a","text":"甲、丁、戊","explanation":"正確。甲應為製造養分；丁應釋出氧氣；戊忽略許多細胞沒有葉綠體。乙與丙皆正確。"},{"id":"b","text":"乙、丙","explanation":"乙與丙是正確敘述，不應選為錯誤。"},{"id":"c","text":"甲、丙、戊","explanation":"甲與戊錯，但丙正確；這組漏掉了錯誤的丁。"},{"id":"d","text":"丙、丁、戊","explanation":"丁與戊錯，但丙正確；這組漏掉了錯誤的甲。"}],"answer":"a","sources":["photo","chloroplast","iodine","photo-review"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"基礎","ability":"科學概念與探究","chapterLabel":"第3章 › 3-3 植物如何製造養分"}],"quick":["主要功能：製造有機養分；氧氣是產物。","原料：二氧化碳＋水；條件：光與葉綠素。","能量：光能 → 養分中的化學能。","葉綠體是構造，葉綠素是色素。","葉肉細胞葉綠體多；保衛細胞也有；一般表皮細胞通常沒有。","氣孔是空隙，不是一個細胞。","葡萄糖可轉成澱粉；碘液遇澱粉呈藍黑色。","實驗先排除原有澱粉，再找「唯一不同的條件」。","遇到原第6題那組敘述：甲、丁、戊錯，乙、丙對；答案是A。"],"book":"第一冊","chapterPath":["第3章","3-3 植物如何製造養分"],"coverage":"detailed-topic"},{"id":"bio-4-2","subject":"science","domain":"生物","grade":7,"semester":1,"publisher":"翰林","schoolYear":115,"chapter":"4-2","title":"植物體內物質的運輸","summary":"根吸收的水分與無機鹽主要走木質部；有機養分走韌皮部；蒸散作用促進水分上升。","tagline":"水與養分，各有路線。","tags":["木質部與韌皮部","蒸散作用","維管束"],"tone":"blue","minutes":12,"version":"1.0.1","updated":"2026-09-24","status":"published","reviewNote":"原有生物專題；出版社已依115官方表核對。課文頁碼與教師範圍仍須對照實際課本。","concepts":[{"id":"root","title":"根吸收水分，也吸收無機鹽","lead":"根毛增加接觸土壤的面積，有利於吸收。","body":["水和溶在水中的無機鹽由根進入植物。水進入根細胞與滲透作用有關。","土壤不是把葡萄糖送給根。植物主要透過光合作用製造有機養分；肥料提供的是生長所需的礦物元素。"],"sources":["transport","moe-transport"]},{"id":"xylem","title":"木質部：水與無機鹽的上行路線","lead":"在本節正常根到葉的情境中，水分主要由下往上運輸。","body":["根吸收的水分與無機鹽，經根、莖、葉相通的木質部送到上部。","有色水實驗常見木質部被染色，顯示它是水分運輸的通路。"],"sources":["transport","moe-transport"],"example":"記憶提示：木運水，根到葉。"},{"id":"phloem","title":"韌皮部：把養分送到需要的部位","lead":"整株植物的養分運輸可向上，也可向下；不是只會往根送。","body":["養分由供應部位送往正在生長或儲存的部位，例如芽、根、果實。","補充：長距離運輸的糖主要是蔗糖，不是把整粒澱粉送進管道。不同運輸路線的方向可以不同。"],"sources":["phloem","transport"],"example":"記憶提示：韌運糖，送到需要的地方。"},{"id":"transpiration","title":"蒸散作用：水先蒸發，再逸出葉片","lead":"植物體內水分以水蒸氣形式散失，主要經過氣孔。","body":["葉片散失水分會形成拉力，促進木質部內的水由根向上運送。","蒸散不是光合作用，也不是植物把液態水「吐出來」。套袋後的水珠是水蒸氣凝結的結果。"],"sources":["transpire","stoma","transport"]},{"id":"environment","title":"乾燥、有風，通常更容易失水","lead":"比較環境時，須假設其他條件相近且植物沒有嚴重缺水。","body":["一般而言，空氣乾燥、氣流增強或溫度升高，會增加蒸散的趨勢；潮濕則降低散失。","但嚴重缺水時氣孔可能關閉，蒸散會下降。因此不能背成「越熱，蒸散一定越快」。"],"sources":["transport","transpire","guard"]},{"id":"vascular","title":"維管束：木質部和韌皮部一起看","lead":"典型雙子葉植物莖的維管束中，木質部偏內、韌皮部偏外。","body":["雙子葉植物莖的維管束通常呈環狀排列；單子葉植物通常呈散生排列。雙子葉植物兩者間可有形成層。","補充題型：若環狀剝除含韌皮部的樹皮而木質部仍完整，養分往下運送受阻；短期內水仍能往上。"],"sources":["bundle","phloem","transport"]}],"diagrams":[{"kind":"flow","title":"水的旅程：土壤 → 葉片 → 空氣","note":"根到葉主要走木質部；水在葉內蒸發，再以水蒸氣經氣孔逸散。","items":[["土壤","水＋無機鹽"],["根／根毛","吸收"],["根與莖的木質部","主要向上運輸"],["葉片","水在葉內蒸發"],["氣孔 → 空氣","水蒸氣散失：蒸散作用"]],"sources":["transport","transpire","stoma","moe-transport"]},{"kind":"branches","title":"養分不是只往下送","note":"箭頭表示整株的不同運輸路線，不是同一條管道在同一時刻相向流動。","center":["葉片等供應部位","可運輸的有機養分"],"branches":[["向上：芽與幼葉","生長需要"],["向其他部位：果實、種子","發育或儲存"],["向下：根與地下儲藏器官","生長或儲存"]],"label":"韌皮部","sources":["phloem","transport"]},{"kind":"layers","title":"典型雙子葉植物莖：從外到內","note":"只是維管束內外關係示意，並非樹幹所有組織的完整橫切圖。","items":[["偏外側：韌皮部","運輸有機養分"],["中間：形成層","可產生新的運輸組織"],["偏內側：木質部","運輸水分與無機鹽"]],"sources":["bundle"]}],"tables":[{"title":"木質部 vs. 韌皮部","headers":["比較","木質部","韌皮部"],"rows":[["主要運送","水＋無機鹽","有機養分（主要以蔗糖運送）"],["方向","根到葉，主要向上","依供應和需求，可向上或向下"],["常見來源","根吸收","葉製造，或儲藏器官釋出"],["典型雙子葉莖位置","偏內側","偏外側"],["考題線索","有色水染色","環狀剝皮阻礙養分"]],"note":"「養分」在此專指有機養分；兩種運輸液都含水，不能延伸成韌皮部裡完全沒有水。","sources":["moe-transport","phloem","bundle","transport"]},{"title":"環境對蒸散的影響","headers":["條件改變","一般趨勢","判斷前提"],"rows":[["空氣更乾燥","較強","水分供應、氣孔狀態相近"],["空氣更潮濕","較弱","其他條件相近"],["風速增加","通常較強","不造成嚴重失水或氣孔關閉"],["溫度升高","通常較強","在適當生理範圍內"],["氣孔關閉","降低","不代表完全沒有水分散失"]],"note":"不能只看單一因素下結論；遇到缺水情境，要先考慮氣孔調節。","sources":["transport","transpire","guard"]}],"experiments":[{"title":"有色水找運輸通道","question":"水在莖內沿哪一種構造運輸？","steps":["讓植物切下的莖吸收有色水。","觀察莖的橫切面與縱切面中被染色的位置。","把染色部分與維管束位置對照。"],"result":"在合適操作下，主要可觀察到木質部的染色路徑。","conclusion":"支持木質部是水分向上運送的通路。","warning":"切片由教師指導；不是整根莖被染色就能直接區分各種組織。","sources":["moe-transport","transport"]},{"title":"葉片套袋觀察蒸散","question":"袋內的水珠是否可能來自葉片？","steps":["使用乾燥透明袋套住葉枝，避免把濕土一併包入。","另設無葉或空袋對照，控制環境與時間。","觀察袋內凝結的水珠並比較對照。"],"result":"有葉枝袋中可出現較明顯水珠；水蒸氣散出後凝結。","conclusion":"排除其他水氣來源後，支持葉片會散失水分。","warning":"袋內水珠本身不是氣孔排出的液滴；它們經過水蒸氣凝結而成。","sources":["transpire","stoma"]},{"title":"環狀剝皮的思考題（補充）","question":"木質部仍完整，為什麼傷口上方可能膨大？","steps":["題目前提：剝除一圈含韌皮部的樹皮。","先追蹤葉片製造的養分往根的路徑是否中斷。","再分開判斷完整木質部是否仍能送水。"],"result":"養分向下運輸受阻，可能在剝除處上方累積；短期水分上運仍可持續。","conclusion":"水與養分主要走不同的運輸組織；長期根部缺乏養分仍會傷害整株。","warning":"這是題型解析，不建議自行剝樹皮；是否列入考試以老師範圍為準。","sources":["phloem","bundle","transport"]}],"traps":[{"wrong":"木質部主要運送葡萄糖。","right":"木質部主要運水與無機鹽；韌皮部主要運有機養分。","why":"先分清運什麼，再判斷方向。","sources":["moe-transport","phloem"]},{"wrong":"韌皮部只會由上往下運輸。","right":"養分可以由供應處向上或向下送到需要的部位。","why":"芽可能在葉片上方，根則在下方，兩者都需要有機養分。","sources":["phloem","transport"]},{"wrong":"蒸散就是植物把液態水從氣孔排出去。","right":"蒸散是水以水蒸氣形式散失。","why":"套袋裡看見的液滴，是散出的水蒸氣凝結而成。","sources":["transpire","stoma"]},{"wrong":"越炎熱，蒸散一定越強。","right":"其他條件相近時通常較強；嚴重缺水可能使氣孔關閉。","why":"題目若有缺水條件，不能忽略植物的調節。","sources":["transport","guard"]},{"wrong":"剝掉一圈樹皮，水立即完全上不去。","right":"若木質部完整，短期水分仍可向上；先受阻的是養分運輸。","why":"長期根部得不到養分，才會逐步影響整株。","sources":["phloem","bundle","transport"]}],"quiz":[{"id":"q1","concept":"xylem","question":"根吸收的水與無機鹽，主要經哪種組織送到葉片？","options":[{"id":"phloem","text":"韌皮部","explanation":"韌皮部主要運送有機養分，不是此題的水與無機鹽上運通道。"},{"id":"xylem","text":"木質部","explanation":"正確。根、莖、葉相通的木質部負責這項運輸。"},{"id":"pore","text":"氣孔","explanation":"氣孔是葉片上的開口，不是從根延伸到葉片的管道。"},{"id":"skin","text":"一般表皮","explanation":"表皮主要保護，並非主要長距離運輸通道。"}],"answer":"xylem","sources":["moe-transport","transport"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"基礎","ability":"科學概念與探究","chapterLabel":"第4章 › 4-2 植物體內物質的運輸"},{"id":"q2","concept":"phloem","question":"葉片製造的養分要送到它上方的嫩芽，哪一個敘述最適當？","options":[{"id":"down","text":"韌皮部只能向下，所以送不到","explanation":"韌皮部不是只能向下運送。"},{"id":"water","text":"改由木質部運送澱粉粒","explanation":"木質部主要運水與無機鹽；澱粉粒也不是長距離運輸的糖形式。"},{"id":"up","text":"可經韌皮部向上送往嫩芽","explanation":"正確。方向依供應部位與需要部位而定。"},{"id":"air","text":"全部直接由氣孔吸入","explanation":"氣孔進出的氣體不能直接取代運輸來的有機養分。"}],"answer":"up","sources":["phloem","transport"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"觀念","ability":"科學概念與探究","chapterLabel":"第4章 › 4-2 植物體內物質的運輸"},{"id":"q3","concept":"transpiration","question":"葉片套乾燥透明袋，排除濕土等干擾後袋內出現水珠，最適當的解釋是？","options":[{"id":"vapour","text":"葉片散出的水蒸氣在袋內凝結","explanation":"正確。蒸散是水蒸氣散失，之後才凝結成看見的水珠。"},{"id":"oxygen","text":"氧氣變成水珠","explanation":"氧氣不會因套袋就自行凝結成水。"},{"id":"sugar","text":"葡萄糖從氣孔流出","explanation":"這不是套袋水珠的形成原因。"},{"id":"solid","text":"無機鹽變成水","explanation":"無機鹽不會轉變成水。"}],"answer":"vapour","sources":["transpire","stoma"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"應用","ability":"科學概念與探究","chapterLabel":"第4章 › 4-2 植物體內物質的運輸"},{"id":"q4","concept":"environment","question":"同種植物、土壤水分充足、氣孔開啟程度相近，哪一種空氣條件通常讓蒸散較旺盛？","options":[{"id":"humid","text":"潮濕且無風","explanation":"潮濕且空氣流動小，通常較不利水蒸氣散失。"},{"id":"closed","text":"完全密閉且接近飽和濕度","explanation":"水蒸氣差異小，通常使蒸散降低。"},{"id":"cold","text":"較冷且潮濕","explanation":"一般不會比乾燥有風時更旺盛。"},{"id":"dry","text":"較乾燥且有適度氣流","explanation":"正確。在題目控制的條件下，較有利水蒸氣散失。"}],"answer":"dry","sources":["transport","transpire"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"易錯","ability":"科學概念與探究","chapterLabel":"第4章 › 4-2 植物體內物質的運輸"},{"id":"q5","concept":"vascular","question":"典型雙子葉植物莖的同一束維管束中，從外側往內側依序是哪一組？","options":[{"id":"a","text":"木質部 → 形成層 → 韌皮部","explanation":"內外顛倒了，木質部偏內側。"},{"id":"b","text":"韌皮部 → 形成層 → 木質部","explanation":"正確。韌皮部偏外，木質部偏內，兩者間可有形成層。"},{"id":"c","text":"形成層 → 木質部 → 韌皮部","explanation":"形成層的位置不在兩種運輸組織的外面。"},{"id":"d","text":"氣孔 → 保衛細胞 → 葉肉","explanation":"這組是葉片構造，不是莖的維管束排列。"}],"answer":"b","sources":["bundle"],"origin":"本站原創觀念檢測；非官方會考真題","difficulty":"基礎","ability":"科學概念與探究","chapterLabel":"第4章 › 4-2 植物體內物質的運輸"}],"quick":["根吸收：水與無機鹽；根毛增加接觸面積。","木質部：水＋無機鹽，正常根到葉的情境主要向上。","韌皮部：有機養分，由供應部位送到需要部位，可上可下。","補充：長距離運輸的糖主要是蔗糖，不是澱粉粒。","蒸散：水以水蒸氣散出，主要經氣孔。","蒸散促進木質部的水上升；套袋水珠是凝結的結果。","乾燥、有風通常較易失水；嚴重缺水可能使氣孔關閉。","典型雙子葉莖：韌皮部在外、形成層在中、木質部在內。","有色水找木質部；環狀剝皮題先追蹤韌皮部的養分路徑。"],"book":"第一冊","chapterPath":["第4章","4-2 植物體內物質的運輸"],"coverage":"detailed-topic"},{"id":"chinese-7-1","subject":"chinese","domain":"國文","grade":7,"semester":1,"publisher function english(tag,r){
 const names=['Amy','Ben','Cindy','David','Emma','Frank','Grace','Henry','Ivy','Jack','Kelly','Leo','Mia','Nora','Owen','Peter'];
 const n=names[integer(r,0,names.length-1)],obj=['a notebook','a map','a storybook','an umbrella'][integer(r,0,3)];
 const cases={
 be:[`${n} ___ a student. 選正確be動詞。`,'is',['are','am','be'],'單數第三人稱搭配is。'],
 plural:[`There are two ___ on ${n}'s desk.`,'boxes',['box','boxs','a box'],'two後接複數，box的複數為boxes。'],
 possessive:[`${n} is a boy. This is ___ bag.`,'his',['he','him','himself'],'名詞bag前用所有格his。'],
 demonstrative:[`These ___ ${n}'s books.`,'are',['is','am','be'],'these是複數，搭配are。'],
 can:[`${n} can ___ very well.`,'swim',['swims','swimming','swam'],'助動詞can後接原形動詞。'],
 wh:[`「___ is ${n}?」答句：「In the library.」`,'Where',['Who','When','Why'],'答句提供地點，問詞用Where。'],
 do:[`___ ${n} walk to school every day?`,'Does',['Do','Is','Are'],'現在簡單式，第三人稱單數用Does發問。'],
 continuous:[`請用現在進行式：${n} ___ a book now.`,'is reading',['read yesterday','reads every day','was read'],'現在進行式＝am/is/are＋V-ing。'],
 frequency:[`${n} always ___ breakfast at home.`,'eats',['eat','eating','to eat'],'一般現在式第三人稱單數用eats。'],
 quantity:[`How ___ water does ${n} need?`,'much',['many','a few','several'],'water在此不可數，搭配much。'],
 time:[`${n} gets up ___ seven o’clock.`,'at',['on','in','to'],'明確時刻前通常用at。'],
 past:[`請用過去簡單式：${n} ___ to the park yesterday.`,'went',['go','goes','going'],'go的過去式為went。'],
 did:[`Did ${n} ___ the room yesterday?`,'clean',['cleaned','cleans','cleaning'],'Did後接原形動詞clean。'],
 'past-continuous':[ `請用過去進行式：${n} ___ dinner at six yesterday.`,'was cooking',['cooks','is cook','has cook'],'過去進行式＝was/were＋V-ing。'],
 because:[`${n} stayed home ___ it was raining.`,'because',['although','unless','so that'],'前後為原因說明，用because。'],
 gerund:[`${n} enjoys ___.`,'reading',['read','to read','reads'],'enjoy後接V-ing。'],
 comparative:[`${n}'s bag is ___ than this one. (heavy)`,'heavier',['heavy','heaviest','more heavier'],'heavy比較級為heavier，不重複加more。'],
 superlative:[`${n} is the ___ student in the group. (tall)`,'tallest',['taller','tall','more tall'],'群體中最高使用最高級tallest。'],
 future:[`${n} will buy ${obj}. will後動詞buy使用哪種形式？`,'原形',['過去式','過去分詞','V-ing'],'will後接原形動詞。'],
 ditransitive:[`${n} gave ${obj} ___ me.`,'to',['at','of','about'],'give物品to某人。'],
 linking:[`${n}'s idea sounds ___.`,'good',['wellly','a well','goodly'],'sound在此為連綴動詞，接形容詞good。'],
 perfect:[`請用現在完成式：${n} ___ the homework.`,'has finished',['finish','finishing','has finish'],'現在完成式＝has/have＋過去分詞。'],
 passive:[`請用過去被動式：The letter ___ by ${n} yesterday.`,'was written',['wrote','is writing','was wrote'],'過去被動式＝was/were＋過去分詞written。'],
 relative:[`The student ___ sits next to ${n} is my friend.`,'who',['which','where','when'],'先行詞是人且關係詞作主詞，用who。'],
 embedded:[`Do you know where ${n} ___?`,'lives',['does live','live does','living'],'間接問句使用主詞＋動詞的陳述語序。'],
 participles:[`${n} felt ___ after the long walk. (tire)`,'tired',['tiring','tire','tires'],'人的感受用tired。'],
 conditional:[`一般條件句：If it rains tomorrow, ${n} ___ at home.`,'will stay',['would stayed','will stayed','staying'],'if子句用現在式表未來，主要子句可用will＋原形。'],
 tag:[`${n} is a student, ___?`,'isn’t '+(n==='Ben'?'he':'she'),['doesn’t it','is they','did it'],'肯定陳述搭配否定附加問句，代詞依題目人物慣用指稱。'],
 both:[`Both ${n} and I ___ ready.`,'are',['is','am','be'],'both A and B為複數主詞，用are。']
 };
 // Avoid assuming gender from names in tag questions: use an explicit subject.
 if(tag==='tag')cases.tag=[`She is ${n}'s teacher, ___?`,'isn’t she',['is she','does she','did she'],'肯定句is搭配否定附加問句isn’t she。'];
 const c=cases[tag];return c?{question:c[0],correct:c[1],wrongs:c[2],explanation:c[3],params:{name:n,object:obj}}:null;
}
function generator(u,tag){if(u.subject==='math')return M[tag];if(u.subject==='science')return S[tag];if(u.subject==='english')return r=>english(tag,r);return null;}
function available(u){return (u.quiz||[]).filter(q=>{const g=generator(u,q.template);return g&&g(rng('probe'))!==null;});}
function candidate(u,base,seed,index,kind){
 let raw,params={};
 if(kind==='static')raw={question:base.question,correct:base.options.find(o=>o.id===base.answer).text,wrongs:base.options.filter(o=>o.id!==base.answer).map(o=>o.text),explanation:base.explanation||base.options.find(o=>o.id===base.answer).explanation};
 else{const gen=generator(u,base.template);if(!gen)throw Error('missing generator');raw=gen(rng(`${seed}/${u.id}/${base.id}/${index}`));if(!raw)throw Error('generator unavailable');params=raw.params;}
 const options=shuffle([raw.correct,...raw.wrongs],rng(`${seed}/options/${u.id}/${base.id}/${index}`)).map((text,i)=>({id:'abcd'[i],text:String(text)}));
 const id=`${u.id}/${kind}/${base.id}/${hash(seed)}/${index}`;
 const result={id,unitId:u.id,templateId:base.id,tag:base.template||base.concept,concept:base.concept,kind,question:raw.question,options,answer:options.find(o=>o.text===String(raw.correct)).id,explanation:raw.explanation,params,provenance:{seed,index,kind,version:VERSION},sources:base.sources||[]};
 if(!validateQuestion(result))throw Error('invalid question '+id);
 return result;
}
function generate(D,cfg){
 if(!plain(cfg))throw Error('需要指定範圍');
 const seed=String(cfg.seed??'');if(!seed||seed.length>80)throw Error('種子需1至80個字元');
 if(!Number.isInteger(cfg.count)||cfg.count<1||cfg.count>20)throw Error('題數需1至20');
 let us;
 if(cfg.unitId){us=D.units.filter(u=>u.id===cfg.unitId&&u.status==='published');if(us.length&&['grade','semester','subject'].some(k=>cfg[k]!==undefined&&cfg[k]!==us[0][k]))throw Error('指定講義不屬於所選年級、學期或科目');}
 else{if(![7,8,9].includes(cfg.grade)||![1,2].includes(cfg.semester)||!D.subjects.some(s=>s.id===cfg.subject))throw Error('無效年級、學期或科目');us=D.units.filter(u=>u.grade===cfg.grade&&u.semester===cfg.semester&&u.subject===cfg.subject&&u.status==='published');}
 if(!us.length)throw Error('此範圍尚無教材');
 const r=rng(seed+'/deck'),pool=[];
 for(const u of us){for(const b of u.quiz)pool.push(candidate(u,b,seed,0,'static'));const gs=available(u);for(let i=0;i<Math.max(48,cfg.count*5)&&gs.length;i++){const b=gs[i%gs.length];pool.push(candidate(u,b,seed,i+1,'generated'));}}
 const seen=new Set(),out=[];
 for(const q of shuffle(pool,r)){const stem=clean(q.question);if(seen.has(stem))continue;seen.add(stem);out.push(q);if(out.length===cfg.count)break;}
 return {version:VERSION,seed,requested:cfg.count,unitIds:us.map(u=>u.id),questions:out,limited:out.length<cfg.count};
}
function validateQuestion(q){return !!(plain(q)&&typeof q.id==='string'&&typeof q.unitId==='string'&&typeof q.question==='string'&&q.question.length&&typeof q.explanation==='string'&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(o=>plain(o)&&typeof o.id==='string'&&typeof o.text==='string'&&o.text.trim())&&new Set(q.options.map(o=>clean(o.text))).size===4&&new Set(q.options.map(o=>o.id)).size===4&&q.options.filter(o=>o.id===q.answer).length===1&&!/NaN|undefined|Infinity/.test(JSON.stringify(q)));}
function newState(){return{app:APP,schema:3,version:VERSION,answers:{},mistakes:[],history:[],conceptStats:{}};}
function migrateState(s){
 if(!plain(s)||s.app!==APP)return s;
 if(s.schema===2){return{...s,schema:3,version:VERSION,mistakes:[],conceptStats:{}};}

 return `<div data-view="practice"><div class="section-heading"><div class="eyebrow">SEE THE REASON, NOT JUST THE LETTER</div><h1>${retry?'錯題原題重練':config.unitIds?'段考整卷作答':'變化題練習'}</h1><p>數學、部分自然與英語改變數值或情境；其他主題抽取原創題並洗牌。完成作答後會依核心觀念累積弱點，下一份同範圍練習優先呈現較弱觀念。</p></div><section class="panel"><div class="filter-grid"><label>年級<select id="practice-grade">${grades(g)}</select></label><label>學期<select id="practice-term">${terms(term)}</select></label><label>科目<select id="practice-subject">${subjectOptions(s)}</select></label><label>題數<select id="practice-count">${(config.unitIds?[10,20,30,40]:[6,8,12,20]).map(n=>`<option${n===config.count?' selected':''}>${n}</option>`).join('')}</select></label></div>${sessionWarning?`<p class="scope-note">${E(sessionWarning)}</p>`:''}${config.unitIds?`<p class="scope-note">整卷範圍：${config.unitIds.map(id=>E(D.units.find(u=>u.id===id)?.title||id)).join('、')}。換一份保留完整範圍與題數。</p>`:''}${u?`<p class="scope-note">指定講義：${E(u.title)}。<a href="#/unit/${u.id}/notes">先讀本節重點 ↗</a></p>`:''}<div class="actions"><button class="btn primary" data-ac="new">換一份題目 ↻</button><button class="btn secondary" data-ac="wrong"${state.mistakes.length?'':' disabled'}>重練已存錯題（${state.mistakes.length}）</button><button class="btn secondary" data-ac="print">列印這份試卷</button></div><p class="small-text muted">種子：${E(deck.seed)} · ${deck.questions.length}題${deck.limited?'（此範圍固定題庫不足指定題數，已減少題數）':''} · ${saved?'作答與題組保存在本機':'暫存模式，請先匯出'}${blocked?'；原有異常資料尚未覆寫':''}</p></section>${questionPanel()}${weaknessPanel()}${backupPanel()}</div>`;
 }
 function questionPanel(){const result=P.score(deck.questions,selections),remaining=deck.questions.length-result.answered;
 return `<div id="practice-questions">${submitted?`<div class="practice-summary" role="status"><h2>${result.correct} / ${result.total} 題正確</h2><p>答對${result.correct}題、答錯${result.answered-result.correct}題、未答${remaining}題。${retry?'本次答對的原題已從錯題庫移除。':'錯題保留完整題目與數值，重練時不會偷偷換題。'}</p><button class="btn secondary" data-ac="retry-current">重做本次錯題／未答題</button></div>`:''}<div class="practice-grid">${deck.questions.map((q,i)=>`<article class="practice-card" id="practice-${i}"><div class="badge-row"><span class="badge green">${i+1} / ${deck.questions.length}</span><span class="badge">${q.kind==='generated'?'參數變化題':'固定題・選項洗牌'}</span><span class="badge">${E(D.units.find(u=>u.id===q.unitId)?.publisher||'')}</span></div><h3>${E(q.question)}</h3><div class="practice-options" role="group" aria-label="第${i+1}題選項">${q.options.map((o,j)=>`<button class="practice-option${selections[q.id]===o.id?' selected':''}${submitted?(o.id===q.answer?' correct':selections[q.id]===o.id?' incorrect':''):''}" data-ac-option="${o.id}" data-ac-question="${E(q.id)}" aria-pressed="${selections[q.id]===o.id}"${submitted?' disabled':''}><b>${'ABCD'[j]}</b><span>${E(o.text)}</span>${submitted&&o.id===q.answer?'<em>正解</em>':''}</button>`).join('')}</div>${submitted?`<div class="practice-explanation"><strong>${selections[q.id]===q.answer?'答對':selections[q.id]?'答錯':'未作答'} · 正確答案 ${'ABCD'[q.options.findIndex(o=>o.id===q.answer)]}</strong><p>${E(q.explanation)}</p><a href="#/unit/${E(q.unitId)}/notes?concept=${E(q.concept)}">回看這個觀念 ↗</a></div>`:''}</article>`).join('')}</div><div class="practice-bottom"><span data-answer-count>已選 ${result.answered} / ${result.total} 題</span><button class="btn primary" data-ac="${submitted?'new':'submit'}">${submitted?'再換一份練習 ↻':'交卷看解析'}</button></div></div>`;
 }
 function backupPanel(){return `<section class="panel practice-backup"><h2>變化題進度與備份</h2><p>未交卷的題組與選項會在此瀏覽器單獨保存，重新整理可繼續作答。以下JSON備份保存已交卷的變化題錯題與最近50次測驗，不含未交卷快照；原本筆記收藏／固定測驗進度仍在「使用與備份」。兩者都不會自動跨裝置同步。</p><div class="actions"><button class="btn secondary" data-ac="export">匯出變化題備份</button><label class="btn secondary file-label">匯入變化題備份<input id="practice-import" type="file" accept=".json,application/json" aria-label="匯入變化題備份"></label></div>${state.history.length?`<details><summary>最近 ${state.history.length} 次紀錄</summary>${state.history.slice(-8).reverse().map(h=>`<p class="small-text muted">${E(h.date)} · ${E(h.label||'練習')} · ${h.correct}/${h.total}</p>`).join('')}</details>`:''}</section>`;}
 function refreshPanel(){document.getElementById('practice-questions').outerHTML=questionPanel();}
 function storeSession(){if(!deck||!liveSig)return;const snapshot={app:'jh-study-practice-session',schema:1,version:P.VERSION,signature:liveSig,deck,selections:{...selections},submitted,retry};sessions.set(liveSig,snapshot);try{localStorage.setItem(SESSION_KEY,JSON.stringify(snapshot));}catch(_){saved=false;}}
 function fresh(seed,keepUnit=true){const p=new URLSearchParams({g:document.getElementById('practice-grade').value,term:document.getElementById('practice-term').value,s:document.getElementById('practice-subject').value,n:String(keepUnit?Number(document.getElementById('practice-count').value):Math.min(20,Number(document.getElementById('practice-count').value))),seed:seed||String(Date.now())+'-'+String(Math.random()).slice(2,8)});if(keepUnit){const previous=new URLSearchParams(location.hash.split('?')[1]||'');const active=previous.get('unit'),exam=previous.get('exam');if(active)p.set('unit',active);if(exam)p.set('exam',exam);}navigate('#/practice?'+p);}
 function click(e){
  const choice=e.target.closest('[data-ac-option]');if(choice){if(!submitted){const q=deck.questions.find(q=>q.id===choice.dataset.acQuestion);if(q){selections[q.id]=choice.dataset.acOption;const card=choice.closest('.practice-card');card.querySelectorAll('.practice-option').forEach(b=>{const yes=b===choice;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',String(yes));});document.querySelector('[data-answer-count]').textContent=`已選 ${P.score(deck.questions,selections).answered} / ${deck.questions.length} 題`;storeSession();}}return true;}
  const b=e.target.closest('[data-ac]');if(!b)return false;
  switch(b.dataset.ac){
   case 'exam-build':{const ids=[...document.querySelectorAll('[data-exam-unit]:checked')].map(x=>x.value);if(!ids.length){toast('請至少勾選一個段考範圍。');break;}const p=new URLSearchParams({g:document.getElementById('exam-grade').value,term:document.getElementById('exam-term').value,s:document.getElementById('exam-subject').value,n:document.getElementById('exam-count').value,units:ids.join(','),seed:String(Date.now())});navigate('#/exam?'+p);break;}
   case 'exam-start':{if(!examDeck)break;const u=D.units.find(u=>u.id===examDeck.unitIds[0]);const p=new URLSearchParams({g:u.grade,term:u.semester,s:u.subject,n:examDeck.requested,exam:examDeck.unitIds.join(','),seed:examDeck.seed});const signature=JSON.stringify(configuration(p));sessions.set(signature,{deck:examDeck,selections:{},submitted:false,retry:false});liveSig='';navigate('#/practice?'+p);break;}
   case 'exam-print':{if(!examDeck)break;const answers=confirm('列印段考卷時要包含答案與解析嗎？按取消則只列題目。');document.getElementById('print-root').innerHTML=`<h1>知識小站・段考模擬卷</h1><p>種子${E(examDeck.seed)} · ${examDeck.questions.length}題 · 範圍：${examDeck.unitIds.map(id=>E(D.units.find(u=>u.id===id)?.title||id)).join('、')}</p>${examDeck.questions.map((q,i)=>`<section class="print-question"><h3>${i+1}. ${E(q.question)}</h3>${q.options.map((o,j)=>`<p>${'ABCD'[j]}. ${E(o.text)}</p>`).join('')}${answers?`<p>答案：${E(q.options.find(o=>o.id===q.answer).text)}。${E(q.explanation)}</p>`:''}</section>`).join('')}`;window.print();break;}
   case 'new':fresh();break;
   case 'submit':{if(submitted)break;const sc=P.score(deck.questions,selections);if(sc.answered<sc.total&&!confirm(`還有${sc.total-sc.answered}題未作答，仍要交卷嗎？`))break;for(const q of deck.questions)if(selections[q.id])state=P.record(state,q,selections[q.id]);state.history=[...state.history,{date:new Date().toLocaleString('zh-TW'),correct:sc.correct,total:sc.total,label:D.units.find(u=>u.id===deck.questions[0]?.unitId)?.title||'練習'}].slice(-50);submitted=true;storeSession();persist();render();document.getElementById('practice-questions').scrollIntoView({block:'start'});break;}
   case 'wrong':{const qs=state.mistakes.slice(-20).map(x=>x.q);if(!qs.length){toast('目前沒有已存錯題。');break;}deck={questions:qs,seed:'錯題原題快照',requested:qs.length,limited:false};selections={};submitted=false;retry=true;snapshotIds=qs.map(q=>q.id);storeSession();render();break;}
   case 'retry-current':{const qs=deck.questions.filter(q=>selections[q.id]!==q.answer);if(!qs.length){toast('本次全部答對，可換一份新題。');break;}deck={...deck,questions:qs,requested:qs.length};selections={};submitted=false;retry=true;storeSession();render();break;}
   case 'export':exportJSON(state,'知識小站_變化題進度.json');break;
   case 'print':{const answers=confirm('列印時要包含正確答案與解析嗎？按取消則只列題目。');document.getElementById('print-root').innerHTML=`<h1>知識小站・變化題試卷</h1><p>V${P.VERSION} · 種子${E(deck.seed)} · ${deck.questions.length}題</p>${deck.questions.map((q,i)=>`<section class="print-question"><h3>${i+1}. ${E(q.question)}</h3>${q.options.map((o,j)=>`<p>${'ABCD'[j]}. ${E(o.text)}</p>`).join('')}${answers?`<p>答案：${E(q.options.find(o=>o.id===q.answer).text)}。${E(q.explanation)}</p>`:''}</section>`).join('')}`;window.print();break;}
  }return true;
 }
 async function change(e){
  if(e.target.id.startsWith('library-')){const p=new URLSearchParams({g:document.getElementById('library-grade').value,term:document.getElementById('library-term').value,s:document.getElementById('library-subject').value});navigate('#/home?'+p);return;}
  if(['practice-grade','practice-term','practice-subject','practice-count'].includes(e.target.id)){fresh(undefined,e.target.id==='practice-count');return;}

  if(e.target.id==='practice-import'){try{const f=e.target.files[0];if(!f)return;if(f.size>2500000)throw Error('備份太大');const next=P.validateState(JSON.parse(await f.text()),D);if(!confirm('將以這份備份取代變化題紀錄，是否繼續？'))return;state=next;blocked=false;persist();sessions.clear();liveSig='';render();toast('已還原變化題進度。');}catch(err){toast('備份無效，原進度未變更。');}finally{e.target.value='';}}
 }
 return{home,versions,practice,examPage,backupPanel,click,change};
}};


/* Knowledge Station: data-driven, dependency-free, local-only study UI. */
(() => {
  'use strict';
  const C = window.StudyCore;
  const D = window.STUDY_DATA;
  const $ = (s, scope = document) => scope.querySelector(s);
  const main = $('#main');
  if (!C || !D) return;
  const errors = C.validateData(D);
  const E = C.escapeHTML;
  if (errors.length) {
    main.innerHTML = `<div class="empty"><h1>教材資料需要修正</h1><p>${E(errors.join('；'))}</p><p>請恢復上一份有效資料後再開啟。</p></div>`;
    return;
  }
  const KEY = 'jh-study-notes.progress.v1';
  const units = D.units.filter(u => u.status === 'published');
  const sources = new Map(D.sources.map(s => [s.id, s]));
  const tabs = [['notes','重點整理'], ['diagrams','圖解比較'], ['traps','易錯觀念'], ['quiz','自我檢測'], ['quick','考前三分鐘']];
  let state = C.defaultState();
  let persistent = true;
  let storageConflict = false;
  let route = {view:'home'};
  let noticeTimer;
  const sessions = new Map();
  const academy=window.AcademyUI.create({D,C,unitCard,getLegacy:()=>state,navigate,render,toast});

  function warnStorage(message) {
    $('#storage-warning').hidden = false;
    $('#storage-warning').textContent = message;
  }
  try {
    const raw = window.localStorage.getItem(KEY);
    if (raw) {
      try { state = C.validateBackup(JSON.parse(raw), D); }
      catch (_) {
        storageConflict = true;
        persistent = false;
        warnStorage('原有進度格式與目前教材不符，尚未覆寫。現在使用暫存模式；可在「使用與備份」匯出暫存進度或匯入有效備份。');
      }
    }
  } catch (_) {
    persistent = false;
    warnStorage('此瀏覽器目前不允許儲存進度。閱讀與測驗仍可使用；離開前請至「使用與備份」匯出進度。');
  }
  function toast(message) {
    const n = $('#notice'); n.textContent = message; n.classList.add('visible');
    clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.remove('visible'), 4200);
  }
  function save() {
    if (!persistent) return;
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (_) {
      persistent = false;
      warnStorage('進度儲存失敗（可能是空間不足或瀏覽器限制）。目前進度仍在本頁，請先匯出備份再離開。');
    }
  }
  function setFont() { document.documentElement.dataset.font = String(state.font); }
  setFont();
  function sourceLine(ids) {
    const links = [...new Set(ids)].map(id => {
      const s = sources.get(id), url = s && C.safeURL(s.url);
      return url ? `<a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(s.title)}</a>` : '';
    }).filter(Boolean);
    return links.length ? `<div class="source-line">資料參考：${links.join(' · ')}</div>` : '';
  }
  function subjectName(u) { return D.subjects.find(s=>s.id===u.subject)?.name || '學科'; }
  function gradeLabel(u) { return ({7:'七',8:'八',9:'九'}[u.grade] || u.grade)+'年級'+(u.semester===1?'上':'下')+'學期'; }
  function unitLabel(u, separator=' · ') { return subjectName(u)+(u.domain&&u.domain!==subjectName(u)?separator+u.domain:'')+' '+u.chapter; }
  function hitLabel(h) {const u=units.find(u=>u.id===h.unit);return u?unitLabel(u):h.chapter;}
  function unitURL(u, tab='notes') { return `#/unit/${u.id}/${tab}`; }
  function getUnit() { return units.find(u => u.id === route.id); }
  function routeFromHash() {
    const hash = location.hash.slice(1) || '/home';
    const [path, query=''] = hash.split('?');
    const parts = path.split('/').filter(Boolean);
    const result = {view:parts[0] || 'home', id:parts[1], tab:parts[2] || 'notes', params:new URLSearchParams(query)};
    if (result.view === 'unit' && !tabs.some(t => t[0] === result.tab)) result.tab = 'notes';
    if(result.view==='practice'&&result.id==='versions')result.view='versions';
    return result;
  }
  function navigate(hash) {
    if (location.hash === hash) render(); else location.hash = hash;
  }
  function navigation() {
    const active = type => route.view === type ? ' active' : '';
    $('#sidebar').innerHTML = `<a href="#/home" class="brand"><span class="brand-mark">知</span><span><span class="brand-name">知識小站</span><span class="brand-sub">STUDY NOTES</span></span></a>
      <div class="nav-group"><div class="nav-label">我的學習</div>
      <a class="nav-item${active('home')}" href="#/home"><span class="nav-icon">⌂</span>學習首頁</a>
      <a class="nav-item${active('review')}" href="#/review"><span class="nav-icon">☆</span>我的複習<span class="end">${state.starred.length}</span></a></div>
      <div class="nav-group"><a class="nav-item${active('practice')}" href="#/practice"><span class="nav-icon">✎</span>變化題練習</a><a class="nav-item${active('versions')}" href="#/versions"><span class="nav-icon">▤</span>官方教材版本</a><div class="nav-label">學科目錄</div>${D.subjects.map(s => {
        const ready = units.some(u => u.subject === s.id);
        return ready ? `<a class="nav-item${(route.view === 'unit' || route.view === 'subject') && (getUnit()?.subject === s.id || route.id === s.id) ? ' active':''}" href="#/subject/${E(s.id)}"><span class="nav-icon">${E(s.short)}</span>${E(s.name)}<span class="end">${units.filter(u=>u.subject===s.id).length}</span></a>` : `<div class="nav-item dim" aria-disabled="true"><span class="nav-icon">${E(s.short)}</span>${E(s.name)}<span class="end">待新增</span></div>`;
      }).join('')}</div><div class="sidebar-bottom"><a class="nav-item${active('help')}" href="#/help"><span class="nav-icon">☷</span>使用與備份</a><div class="local-note">進度只存在這個瀏覽器<br>定期備份，安心複習。</div><div class="version-line">V${E(D.appVersion)} · ${E(D.updated)}</div></div>`;
    $('#mobile-nav').innerHTML = [['home','⌂','首頁'],['practice','✎','練習'],['review','☆','複習'],['search','⌕','搜尋'],['help','☷','備份']].map(([id,icon,label])=>`<a href="#/${id}" class="${route.view===id?'active':''}"><span aria-hidden="true">${icon}</span>${label}</a>`).join('');
    const labels = {exam:'段考組卷',practice:'變化題練習',versions:'官方教材版本',home:'學習首頁',review:'我的複習',search:'搜尋教材',help:'使用與備份',subject:'學科目錄'};
    $('#breadcrumb').textContent = route.view === 'unit' ? (getUnit()?unitLabel(getUnit(),' ／ '):'學習章節') : labels[route.view] || '知識小站';
  }
  function heading(title, description='') {
    return `<div class="section-heading"><h2>${E(title)}</h2>${description ? `<p>${E(description)}</p>` : ''}</div>`;
  }
  function unitCard(u) {
    const s = C.score(u, state.answers);
    return `<article class="unit-card" data-unit-card="${u.id}"><a href="${unitURL(u)}" class="unit-cover ${u.tone==='blue'?'blue':''}" aria-label="開啟${E(u.chapter+' '+u.title)}"><span class="eyebrow">${E(subjectName(u)+(u.domain?" · "+u.domain:""))}</span><span class="chapter-number">${E(u.chapter)}</span><span class="cover-symbol" aria-hidden="true">${u.tone==='blue'?'↟':'☘'}</span></a>
      <div class="unit-card-body"><div class="badge-row"><span class="badge green">${E(gradeLabel(u))}</span><span class="badge">${E(u.publisher)}</span></div><h3><a href="${unitURL(u)}">${E(u.title)}</a></h3><p>${E(u.summary)}</p><div class="tag-row">${u.tags.map(x=>`<span class="tag">${E(x)}</span>`).join('')}</div></div>
      <div class="unit-card-foot"><span>${state.read.includes(u.id)?'✓ 已讀完':`${u.concepts.length} 個重點 · 約 ${u.minutes} 分鐘`}${s.answered ? ` · 測驗 ${s.correct}/${s.total}`:''}</span><a href="${unitURL(u)}">開始學習 <span aria-hidden="true">↗</span></a></div></article>`;
  }
  function home(subject) { return academy.home(subject,route.params); }
  function conceptCard(u,c,i) {
    const key = `${u.id}/${c.id}`, saved=state.starred.includes(key);
    return `<article class="concept-card" data-concept-card="${E(c.id)}" id="concept-${E(c.id)}"><div class="concept-top"><span class="index-pill">重點 ${String(i+1).padStart(2,'0')}</span><button type="button" class="star-btn${saved?' saved':''}" data-star="${E(key)}" aria-pressed="${saved}" aria-label="${saved?'移除複習':'加入複習'}：${E(c.title)}">${saved?'★':'☆'}</button></div><h3>${E(c.title)}</h3><p class="lead">${E(c.lead)}</p><div class="concept-body">${c.body.map(p=>`<p>${E(p)}</p>`).join('')}</div>${c.example?`<div class="example">${E(c.example)}</div>`:''}${sourceLine(c.sources)}</article>`;
  }
  function notes(u) {
    return `${heading('先讀懂這 '+u.concepts.length+' 個重點','每張卡片只解決一個觀念。還不熟的，點星號留待複習。')}<div class="concept-grid">${u.concepts.map((c,i)=>conceptCard(u,c,i)).join('')}</div>`;
  }
  function diagram(d) {
    let body='';
    if (d.kind==='equation') {

    } else if(d.kind==='layers') {
      body=`<div class="layers">${d.items.map(x=>`<div class="layer"><strong>${E(x[0])}</strong><span>${E(x[1])}</span></div>`).join('')}</div>`;

    }

  function table(t) {

  function quick(u) {
    return `${heading('考前三分鐘，再順一次','先遮住筆記回想，再對照這些關鍵句。')}<div class="quick-grid">${u.quick.map((t,i)=>`<div class="quick-line"><b>${String(i+1).padStart(2,'0')}</b><span>${E(t)}</span></div>`).join('')}</div><div class="mantra"><strong>能用自己的話說明，才算真正讀懂。</strong><p>覺得都會了？到「自我檢測」驗證看看。</p></div>`;

  function session(u) {
    if (!sessions.has(u.id)) {
      const first = u.quiz.findIndex(q => !state.answers[`${u.id}/${q.id}`]);

  function resultHTML(u) {

  function quiz(u) {
    const s=session(u);

    const selected=submitted || s.selection;
    const answer=q.options.find(o=>o.id===q.answer);

    const correct=submitted===q.answer;
    const isLast=s.index===s.ids.length-1;
    return `${heading('不用急，先想清楚再作答','每題作答後顯示解析；答錯的，可以在結束後單獨重作。')}<section class="panel" data-quiz><div class="quiz-meta"><span>${s.ids.length===u.quiz.length?'章節自我檢測':'錯題重作'} · ${E(u.chapter)}</span><span>第 ${s.index+1} 題 / 共 ${s.ids.length} 題</span></div><div class="quiz-progress" aria-label="題目進度"><span style="width:${((s.index+1)/s.ids.length)*100}%"></span></div><h3 class="question-text">${E(q.question)}</h3><div class="options" role="group" aria-label="選擇一個答案">${q.options.map((o,i)=>{
      const cls=submitted?(o.id===q.answer?' correct':o.id===selected?' incorrect':''):(o.id===selected?' selected':'');
      return `<button type="button" class="option-btn${cls}" data-option="${E(o.id)}" aria-pressed="${o.id===selected}"${submitted?' disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${E(o.text)}</span>${submitted&&o.id===q.answer?'<span class="option-status">✓ 正解</span>':''}</button>`;
    }).join('')}</div>${submitted?`<div class="feedback${correct?'':' wrong'}" data-feedback role="status"><strong>${correct?'✓ 答對了':'再想一想：這題答錯了'}</strong><p>${E(chosen.explanation)}</p>${!correct?`<p><strong>正確答案：${E(answer.text)}</strong><br>${E(answer.explanation)}</p>`:''}<a href="${unitURL(u)}?concept=${q.concept}">回看這個觀念 ↗</a></div>`:''}<div class="quiz-controls"><span class="small-text muted">${E(q.origin)}</span>${submitted?`<button class="btn primary" data-action="next-question">${isLast?'查看結果':'下一題'} →</button>`:`<button class="btn primary" data-action="submit-answer"${selected?'':' disabled'}>確認答案 →</button>`}</div>${sourceLine(q.sources)}</section>`;
  }

  function help() {
    return `<div data-view="help">${heading('使用與備份','一個安靜的學習空間。沒有帳號、廣告或追蹤程式。')}<section class="panel help-section"><h3>先看懂，再練習</h3><p>每節提供重點整理、圖解比較、易錯觀念、自我檢測與考前三分鐘。重點卡的星號可以加入「我的複習」；「已讀完」是閱讀標記，不代表測驗全部答對。</p><p>測驗記錄的是每題最近一次已確認的答案。完成後可只重作錯題；重新練習會清除該範圍原答案。</p></section>
      <section class="panel help-section"><h3>進度備份與還原</h3><p>已讀、複習星號、測驗答案與字級，只保存在目前瀏覽器的本站空間。不同裝置、不同網址與離線檔案不會自動同步；清除網站資料或使用隱私模式也可能失去進度。</p><div class="answer-box"><strong>目前儲存狀態：${persistent?'瀏覽器本機儲存':'暫存模式（請匯出後再離開）'}</strong><p>匯入前會檢查檔案格式、章節與答案；確認後才取代目前進度。只接受本網站 JSON 備份，不接受課本照片或其他檔案。</p></div><div class="actions"><button class="btn primary" data-action="export">匯出進度備份</button><label class="btn secondary file-label">匯入進度備份<input id="backup-file" type="file" accept=".json,application/json" aria-label="匯入進度備份"></label></div><p class="small-text muted">每次離線與線上切換前建議備份。瀏覽器不允許儲存時仍可閱讀、練習、匯出。</p></section>
      <section class="panel help-section"><h3>教材範圍與版本</h3><div class="version-row"><strong>網站版本</strong><span>V${E(D.appVersion)} · ${E(D.updated)}</span></div><div class="version-row"><strong>目前範圍</strong><span>62份學期核心／語言學習指南＋2份原有生物專題</span></div><div class="warning">${E(D.sourceNotice)}</div><p>2026-09-24直接取得校方115學年度原始版本圖片，逐格核對31個出版社欄位。公告網址沿用舊頁，搜尋快取可能仍顯示舊學年度；本版以原圖內容為準。</p><a href="#/versions">查看官方版本矩陣與核對說明 ↗</a><p>所有文字、示意圖與測驗以自主學習整理呈現，並非出版社頁面重製或官方考題。教材來源可供核對，但不代表學校或出版社對本站背書。生物構造示意不按實際比例繪製。</p></section>

      ${academy.backupPanel()}<section class="panel help-section"><h3>資料與隱私</h3><p>網站不要求學生姓名、班級或成績單，不上傳瀏覽器進度。點擊外部來源連結才會開啟第三方網站。正式發布到 GitHub Pages 時，不應加入含學生個資的試卷影像。</p><p>列印功能會完整展開本節，可選擇附上測驗解析。瀏覽器提供的「另存為 PDF」是列印選項，不是額外的雲端服務。</p></section>
      <section class="panel help-section"><h3>查核與參考來源</h3><p class="small-text muted">查閱日期 ${E(D.updated)}。教材使用對應教育與生物學資料；學校公告僅證明出版社，不代表學校或出版社審核本站全部內容。</p>${D.sources.map(s=>`<div class="source-item"><a href="${E(C.safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${E(s.title)} ↗</a><p>${E(s.note || '')}</p></div>`).join('')}</section></div>`;

  function notFound() {

  function renderQuiz(u) { $('#unit-content').innerHTML=quiz(u); }
  function resetQuiz(u,onlyWrong) {

    if(!ids.length) return;
    const answers={...state.answers}; ids.forEach(id=>delete answers[`${u.id}/${id}`]);

  function exportBackup() {
    const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download=`知識小站_進度_${new Date().toISOString().slice(0,10)}.json`;a.style.display='none';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已提出備份下載，請確認檔案已儲存。');
  }
  async function importBackup(file,input) {
    if(!file) return;
    try {
      if(file.size>1024*1024) throw new Error('備份檔案過大；原有進度未變更。');
      const next=C.validateBackup(JSON.parse(await file.text()),D);
      if(!window.confirm('要以這份備份取代目前的已讀、複習與作答紀錄嗎？尚未匯出的進度會被取代。')) return;
      state=next;sessions.clear();setFont();
      if(storageConflict) {persistent=true;storageConflict=false;$('#storage-warning').hidden=true;}
      save(); render(); toast('已還原進度備份。'+(!persistent?'目前仍為暫存模式。':''));
    } catch (_) { toast('備份格式或教材版本不符；原有進度未變更。'); }
    finally { if(input) input.value=''; }
  }
  function printContent(u,withAnswers) {
    const qs=u.quiz.map((q,i)=>`<section class="print-question"><h3>${i+1}. ${E(q.question)}</h3><p>${q.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${E(o.text)}`).join('\n')}</p>${withAnswers?`<div class="print-answer"><strong>參考答案：${String.fromCharCode(65+q.options.findIndex(o=>o.id===q.answer))}</strong>${q.options.map((o,j)=>`<p>${String.fromCharCode(65+j)}：${E(o.explanation)}</p>`).join('')}</div>`:''}</section>`).join('');
    return `<header class="print-header"><h1>${E(u.chapter+' '+u.title)}</h1><p>知識小站 · ${E(u.publisher)} · V${E(D.appVersion)} · ${E(D.updated)}</p><p>115出版社已核對；本站核心指南非課本完整逐課摘要，實際頁碼與教師範圍須對照。</p></header><section class="print-section">${notes(u)}</section><section class="print-section">${diagrams(u,true)}</section><section class="print-section">${traps(u)}</section><section class="print-section">${quick(u)}</section><section class="print-section"><h2>自我檢測</h2>${qs}</section>`;
  }
  document.addEventListener('click',e=>{
    if(academy.click(e))return;
    const star=e.target.closest('[data-star]');
    if(star) {
      const key=star.dataset.star;
      if(!units.some(u=>u.concepts.some(c=>`${u.id}/${c.id}`===key))) return;
      state=C.toggle(state,'starred',key); save();
      if(route.view==='review') {const y=window.scrollY;render();window.scrollTo(0,y);}
      else {
        const selected=state.starred.includes(key);
        star.classList.toggle('saved',selected);star.setAttribute('aria-pressed',String(selected));star.textContent=selected?'★':'☆';
        star.setAttribute('aria-label',star.getAttribute('aria-label').replace(selected?'加入複習':'移除複習',selected?'移除複習':'加入複習'));
        navigation();
      }
      toast(state.starred.includes(key)?'已加入「我的複習」':'已移出複習清單');return;
    }
    const option=e.target.closest('[data-option]');
    const u=getUnit();
    if(option&&u&&route.tab==='quiz') {
      const s=session(u), q=u.quiz.find(q=>q.id===s.ids[s.index]);
      if(!state.answers[`${u.id}/${q.id}`]&&q.options.some(o=>o.id===option.dataset.option)) {
        s.selection=option.dataset.option;renderQuiz(u);
        $(`[data-option="${s.selection}"]`)?.focus({preventScroll:true});
      }
      return;
    }
    const button=e.target.closest('[data-action]');if(!button) return;
    switch(button.dataset.action) {
      case 'font': state={...state,font:(state.font+1)%3};setFont();save();toast(['字級：標準','字級：加大','字級：特大'][state.font]);break;
      case 'read': if(u) {state=C.toggle(state,'read',u.id);save();button.textContent=state.read.includes(u.id)?'✓ 已讀完':'標記為已讀完';button.setAttribute('aria-pressed',String(state.read.includes(u.id)));toast(state.read.includes(u.id)?'已標記本節讀完':'已取消讀完標記');}break;
      case 'submit-answer': if(u) {
        const s=session(u),q=u.quiz.find(q=>q.id===s.ids[s.index]);
        if(!s.selection || state.answers[`${u.id}/${q.id}`]) break;
        state={...state,answers:{...state.answers,[`${u.id}/${q.id}`]:s.selection}};save();renderQuiz(u);$('[data-feedback]')?.scrollIntoView({block:'nearest'});
      } break;
      case 'next-question': if(u) {
        const s=session(u),q=u.quiz.find(q=>q.id===s.ids[s.index]);if(!state.answers[`${u.id}/${q.id}`]) break;
        if(s.index>=s.ids.length-1) s.result=true;else {s.index++;s.selection=null;}
        renderQuiz(u);$('#unit-content').scrollIntoView({block:'start'});
      } break;
      case 'retry-wrong': if(u) resetQuiz(u,true);break;
      case 'retry-all': if(u&&window.confirm('重新練習本節全部題目？這會清除本節已確認的作答。')) resetQuiz(u,false);break;
      case 'export': exportBackup();break;
      case 'print-open': if(u) {$('#print-answers').checked=false;$('#print-dialog').showModal();}break;
      case 'print-close': $('#print-dialog').close();break;
      case 'print-go': if(u) {$('#print-root').innerHTML=printContent(u,$('#print-answers').checked);$('#print-dialog').close();window.print();}break;
    }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='search-input') $('[data-search-results]').innerHTML=searchResults(e.target.value.slice(0,100));
  });
  document.addEventListener('change',e=>{academy.change(e);if(e.target.id==='backup-file') importBackup(e.target.files[0],e.target);});
  $('#header-search').addEventListener('submit',e=>{e.preventDefault();navigate('#/search?q='+encodeURIComponent($('#global-search').value.trim().slice(0,100)));});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();});
  window.addEventListener('hashchange',render);
  // Browser print shortcuts should produce the same complete chapter notes.
  window.addEventListener('beforeprint',()=>{const u=getUnit();if(u&&!$('#print-root').textContent.trim())$('#print-root').innerHTML=printContent(u,false);});
  window.addEventListener('afterprint',()=>{$('#print-root').innerHTML='';});
  render();
})();


</script>


</body></html>
