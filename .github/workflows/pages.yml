name: Test and deploy Study Planner

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install planner dependencies
        run: npm install --no-audit --no-fund
      - name: Run original planner tests
        run: npm test
      - name: Test study notes content and question engine
        run: node --test assets/study-notes/v120/tests/*.test.cjs assets/study-notes/v120/tests/resumption-acceptance.cjs
      - name: Build Pages artifact
        run: |
          rm -rf .pages
          mkdir -p .pages/css .pages/js
          cp index.html .pages/
          cp -R css/. .pages/css/
          cp -R js/. .pages/js/
          if [ -d assets ]; then cp -R assets .pages/assets; fi
          node assets/study-notes/v120/build-114.cjs assets/study-notes/index.html .pages/assets/study-notes/index.html
          rm -rf .pages/assets/study-notes/v120
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser acceptance
        run: |
          python -m pip install playwright==1.57.0 sympy==1.14.0
          python -m playwright install --with-deps chromium
      - name: Independently verify original mathematics answers
        run: |
          mkdir -p notes-browser-evidence
          python assets/study-notes/v120/tests/math-answer-audit.py notes-browser-evidence/exact-math.json
          python assets/study-notes/v120/tests/lower114-answer-audit.py notes-browser-evidence/lower114-answers.json
      - name: Native study-notes browser acceptance
        run: python assets/study-notes/v120/tests/browser-resume.py .pages/assets/study-notes/index.html notes-browser-evidence
      - name: Full exam and session reliability
        run: python assets/study-notes/v120/tests/reliability-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/reliability
      - name: Verified chapter navigation and new lesson acceptance
        run: python assets/study-notes/v120/tests/chapters-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/chapters
      - name: Homepage and catalog navigation acceptance
        run: python assets/study-notes/v120/tests/home-navigation-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/home-navigation
      - name: Teaching atlas and source evidence acceptance
        run: python assets/study-notes/v120/tests/atlas-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/atlas
      - name: Complete upper-semester mathematics acceptance
        run: python assets/study-notes/v120/tests/math-completion-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/math-completion
      - name: Adopted 114 lower-semester teaching acceptance
        run: python assets/study-notes/v120/tests/lower114-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/lower114
      # Preserve the existing V1.8 regression suite above, then validate the final V1.9 build.
      - name: Build integrated teaching and free-resource release
        run: node assets/study-notes/v120/build-free.cjs assets/study-notes/index.html .pages/assets/study-notes/index.html
      - name: Validate final integrated release in native browser
        run: python assets/study-notes/v120/tests/free-integration-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/free-integration
      - name: Build V2 full curriculum catalog and original guides
        run: node assets/study-notes/v120/build-complete.cjs assets/study-notes/index.html .pages/assets/study-notes/index.html
      - name: Validate V2 catalog, lessons and practice in native browser
        run: python assets/study-notes/v120/tests/catalog-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/catalog
      - name: Build V2.1 all-subject worked examples and expanded practice
        run: node assets/study-notes/v120/build-all-subjects.cjs assets/study-notes/index.html .pages/assets/study-notes/index.html
      - name: Build source-checked historical exam solution guides
        run: node assets/study-notes/v120/build-exam-solutions.cjs assets/study-notes/index.html .pages/assets/study-notes/index.html
      - name: Build compact homepage with on-demand lesson delivery
        run: node assets/study-notes/v120/build-web.cjs .pages/assets/study-notes/index.html .pages/assets/study-notes/index.html
      - name: Validate final web delivery, progress reload and network recovery
        run: python assets/study-notes/v120/tests/web-delivery-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/web-delivery
      - name: Validate semester guidance and saved fixed-question correction
        run: python assets/study-notes/v120/tests/learning-path-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/learning-path
      - name: Validate historical solutions and paper download recovery
        run: python assets/study-notes/v120/tests/exam-solutions-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/exam-solutions
      - name: Validate source-scoped reading additions and saved progress
        run: python assets/study-notes/v120/tests/reading-support-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/reading-support
      - name: Validate direct lesson switching and mobile navigation
        run: python assets/study-notes/v120/tests/lesson-navigation-browser.py .pages/assets/study-notes/index.html notes-browser-evidence/lesson-navigation
      - name: Archive tracked study-notes source
        run: git archive --format=tar HEAD assets/study-notes .github/workflows/pages.yml > notes-browser-evidence/study-notes-source.tar
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-verification
          path: notes-browser-evidence/
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published notes HTML and planner entry
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.parse, json, re, hashlib
          base=os.environ['SITE'].rstrip('/')+'/'
          notes=base+'assets/study-notes/'
          for attempt in range(12):
              try:
                  url=notes+'?verify='+os.environ['GITHUB_SHA']+'-'+str(attempt)
                  with urllib.request.urlopen(url,timeout=25) as r:
                      assert r.status==200
                      html=r.read().decode('utf-8')
                  m=re.search(r'window\.STUDY_DATA\s*=\s*(\{.*?\});\s*</script>',html,re.S)
                  assert m, 'Embedded curriculum missing'
                  data=json.loads(m.group(1))
                  assert data['appVersion']=='2.1.6', 'Pages cache still holds earlier version'
                  assert 'data-learning-entry' in html.split('window.STUDY_DATA =')[0], 'Learning entry missing from homepage'
                  assert len(html.encode('utf-8'))<2000000, 'Homepage payload budget exceeded'
                  assert '今天，從哪一科開始' in html.split('window.STUDY_DATA =')[0], 'Prerendered homepage missing'
                  assert all('question' not in u['quiz'][0] for u in data['units']), 'Full question bank blocks homepage'
                  assert all('readingSupport' not in u for u in data['units']), 'Reading bodies block homepage'
                  with urllib.request.urlopen(notes+'delivery-manifest.json?verify='+os.environ['GITHUB_SHA'],timeout=25) as r:
                      manifest=json.load(r)
                  assert manifest['version']==data['appVersion'] and manifest['unitCount']==763
                  assert len(manifest['papers'])==data['examSolutions']['paperCount']==40
                  assert all('items' not in p for p in data['examSolutions']['papers']), 'Paper bodies block homepage'
                  for paper in manifest['papers']:
                      with urllib.request.urlopen(notes+paper['file'],timeout=25) as r:
                          paper_raw=r.read()
                      assert hashlib.sha256(paper_raw).hexdigest()==paper['sha256'], 'Published paper hash mismatch'
                      payload=json.loads(paper_raw)
                      expected=next(p for p in data['examSolutions']['papers'] if p['sourceId']==paper['sourceId'])
                      assert payload['sourceId']==expected['sourceId'] and len(payload['items'])==expected['totalItems']
                      source=next(p for p in data['atlas']['exams'] if p['sourceId']==paper['sourceId'])
                      assert payload['sourceSha256']==source['sha256']
                  with urllib.request.urlopen(notes+manifest['all']['file'],timeout=25) as r:
                      content=r.read()
                  assert hashlib.sha256(content).hexdigest()==manifest['all']['sha256'], 'Published content hash mismatch'
                  full=json.loads(content)
                  assert [u['id'] for u in data['units']]==[u['id'] for u in full['units']]
                  data['units']=full['units']
                  assert len(data['units'])==763
                  assert sum(len(u['quiz']) for u in data['units'])==4578
                  reading=[u for u in data['units'] if u.get('contentMode')=='reading-guide']
                  assert len(reading)==data['readingSupport']['total']==74
                  for status,field in [('original-verified','originalVerified'),('edition-verified','editionVerified'),('source-needed','sourceNeeded')]:
                      assert sum(u['readingSupport']['status']==status for u in reading)==data['readingSupport'][field]
                  assert all(u['readingSupport']['sectionId']==u['catalogSectionId'] and u['readingSupport']['title']==u['title'] and u['readingSupportStatus']==u['readingSupport']['status'] for u in reading)
                  assert all(len(u['quiz'])>=6 for u in data['units'])
                  assert data['subjectCompletion']['workedExamples']==578
                  assert len(data['subjectCompletion']['scopes'])==66
                  assert all(s['units']>0 for s in data['subjectCompletion']['scopes'])
                  assert data['catalogCompletion']['locatedSections']==697
                  assert data['catalogCompletion']['pendingSections']==0
                  assert data['catalogCompletion']['untranscribedCourses']==0
                  assert all(s.get('unitId') for c in data['atlas']['courses'] for s in c['sections'])
                  assert all(c['readySections']+c.get('readingGuideSections',0)==len(c['sections']) for c in data['atlas']['courses'])
                  assert sum(len(b['sections']) for b in data['courseMap']['books'])==105
                  assert len(data['courseMap']['books'])==6
                  assert len(data['atlas']['courses'])==106 and len(data['atlas']['exams'])==40
                  biology=next(c for c in data['atlas']['courses'] if c['id']=='115-1-7-biology')
                  assert len(biology['sections'])==22 and biology['readySections']==22
                  math=[c for c in data['atlas']['courses'] if c['year']==115 and c['term']==1 and c['subject']=='math']
                  assert len(math)==3 and sum(c['readySections'] for c in math)==31
                  assert all(c['readySections']==len(c['sections']) for c in math)
                  lower=[c for c in data['atlas']['courses'] if c['year']==114 and c['term']==2 and c['subject']=='math']
                  assert len(lower)==3 and sum(c['readySections'] for c in lower)==29
                  assert all(c['readySections']==len(c['sections']) for c in lower)
                  assert all(u['schoolYear']==114 and u['semester'] in (1,2) for u in data['units'] if u.get('historicalAdoption'))
                  assert len(data['freeResources']['resources'])==29
                  assert all(not r['localTeachingComplete'] and not r['localTestComplete'] for r in data['freeResources']['resources'])
                  assert data['atlas']['statistics']['sourceCount']==146
                  assert data['atlas']['adoptionPolicy']['currentYearReplacement'] is False
                  assert 'home-welcome' in html and 'LibraryNavigation.normalizeRoute' in html, 'Home/catalog separation missing'
                  assert 'PRACTICE_ADDON_V110' not in html
                  assert 'function validateSession(s,D)' in html, 'Session reliability update missing'
                  assert 'data-ac="exam-start"' in html, 'Full exam answering update missing'
                  with urllib.request.urlopen(base,timeout=25) as r:
                      planner=r.read().decode('utf-8')
                  assert 'js/app.js' in planner, 'Planner entry not preserved'
                  print('LIVE_VERIFIED',json.dumps({'url':notes,'version':data['appVersion'],'units':len(data['units']),'fixedQuestions':sum(len(u['quiz']) for u in data['units']),'catalog':data['catalogCompletion'],'sourceCount':146,'externalResources':29,'biologySectionsReady':22,'mathSectionsReady':31,'adopted114MathSections':29,'verifiedNumberedSections':105,'examSessionRepair':True,'plannerEntry':'preserved','commit':os.environ['GITHUB_SHA']},ensure_ascii=False))
                  break
              except Exception as error:
                  if attempt==11:raise
                  print('Waiting for Pages propagation:',type(error).__name__,str(error))
                  time.sleep(10)
          PY
