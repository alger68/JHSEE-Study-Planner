name: Study notes source bundle
on:
  push:
    branches: [study-notes-v120]
    paths: ['.github/workflows/study-notes-source-bundle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > study-notes-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: study-notes-resume-source
          path: study-notes-source.tar
          retention-days: 7
