name: Study notes source audit
on:
  push:
    branches: [study-notes-v120]
    paths: ['.github/workflows/study-notes-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official school textbook announcement
        shell: bash
        run: |
          mkdir -p source-audit
          python - <<'PY'
          import urllib.request, urllib.parse, pathlib, json, re, subprocess
          from html.parser import HTMLParser
          out=pathlib.Path('source-audit')
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.images=[]; self.text=[]; self.anchor=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a': self.anchor=[a.get('href',''),'']; self.links.append(self.anchor)
                  if tag=='img': self.images.append(a.get('src',''))
              def handle_endtag(self,tag):
                  if tag=='a': self.anchor=None
              def handle_data(self,s):
                  self.text.append(s)
                  if self.anchor is not None:self.anchor[1]+=s
          def fetch(url):
              if urllib.parse.urlparse(url).hostname!='www.jhjhs.ntpc.edu.tw':raise ValueError('Only official school host is allowed')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (study-notes public-source verification)'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read(2500000)
                  return data,r.headers.get('Content-Type','')
          root='https://www.jhjhs.ntpc.edu.tw/p/412-1000-178.php'
          results=[]
          try:
              data,typ=fetch(root);out.joinpath('list.html').write_bytes(data)
              p=Page();p.feed(data.decode('utf-8',errors='replace'))
              candidates=[(urllib.parse.urljoin(root,u),t.strip()) for u,t in p.links if '教科書' in t and ('115' in t or '114' in t)]
              print('ANNOUNCEMENTS',json.dumps(candidates,ensure_ascii=False))
              for i,(url,title) in enumerate(candidates[:3]):
                  raw,typ=fetch(url);out.joinpath(f'announcement-{i}.html').write_bytes(raw)
                  doc=Page();doc.feed(raw.decode('utf-8',errors='replace'))
                  visible=' '.join(s.strip() for s in doc.text if s.strip())
                  print('PAGE',url,title,visible[-12000:])
                  images=[urllib.parse.urljoin(url,u) for u in doc.images if '/pictures/' in u]
                  print('IMAGES',json.dumps(images,ensure_ascii=False))
                  for j,img in enumerate(images[:4]):
                      try:
                          image,kind=fetch(img);out.joinpath(f'image-{i}-{j}.png').write_bytes(image)
                      except Exception as e:print('IMAGE_ERROR',str(e))
                  files=[(urllib.parse.urljoin(url,u),t.strip()) for u,t in doc.links if 'downloadfile' in u or u.lower().endswith('.pdf')]
                  print('FILES',json.dumps(files,ensure_ascii=False))
                  for j,(file_url,label) in enumerate(files[:4]):
                      try:
                          blob,kind=fetch(file_url);path=out/f'document-{i}-{j}.pdf';path.write_bytes(blob)
                          if blob.startswith(b'%PDF'):
                              result=subprocess.run(['pdftotext','-layout',str(path),'-'],capture_output=True,text=True)
                              print('PDF_TEXT',label,result.stdout[:20000]);out.joinpath(f'document-{i}-{j}.txt').write_text(result.stdout)
                      except Exception as e:print('FILE_ERROR',str(e))
                  results.append({'url':url,'title':title,'images':images,'files':files})
          except Exception as e:print('SOURCE_FETCH_FAILED',type(e).__name__,str(e))
          out.joinpath('sources.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-school-source-audit
          path: source-audit
          retention-days: 7
